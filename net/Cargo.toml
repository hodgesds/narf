[package]
name         = "narf-net"
description  = "Frame-ring contract, interface registry, loopback. Stage 3 net."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_net"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-capabilities = { path = "../capabilities" }
narf-ipc          = { path = "../ipc" }
narf-io           = { path = "../io" }
narf-scheduler    = { path = "../scheduler" }
narf-console      = { path = "../console" }
narf-kernel-test  = { path = "../verification/kernel-test" }

[features]
# Compile the in-kernel test suite (the `kernel_test_in!` smokes). Off by
# default so production kernels exclude all test code; the frame aggregator's
# `kernel-test` feature enables it for the test image.
kernel-test = []

[lints]
workspace = true
