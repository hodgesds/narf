[package]
name         = "narf-power"
description  = "Power management: C-state registry, idle governor, DVFS governors, runtime PM."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_power"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-arch         = { path = "../arch" }
narf-memory       = { path = "../memory" }
narf-abi          = { path = "../abi" }
narf-time         = { path = "../time" }
narf-init         = { path = "../init" }
narf-console      = { path = "../console" }
narf-scheduler    = { path = "../scheduler" }
narf-capabilities = { path = "../capabilities" }
narf-bus          = { path = "../bus" }
narf-acpi         = { path = "../acpi" }
narf-aml          = { path = "../aml" }
narf-interrupts   = { path = "../interrupts" }
narf-event-bus    = { path = "../event_bus" }
narf-filesystem   = { path = "../filesystem" }
narf-input        = { path = "../input" }
narf-crypto       = { path = "../crypto" }
narf-ctap2        = { path = "../ctap2" }
narf-block        = { path = "../block" }
narf-drivers-tpm  = { path = "../drivers/tpm" }
narf-kernel-test  = { path = "../verification/kernel-test" }
zeroize           = { version = "1", default-features = false, features = ["alloc"] }
argon2            = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }

[features]
kernel-test = ["narf-ctap2/fixture-token", "narf-drivers-tpm/fixture-tpm"]

[lints]
workspace = true
