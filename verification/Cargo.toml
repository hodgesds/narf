[package]
name         = "narf-verification"
description  = "Kernel-test harness: #[kernel_test] collector, runtime dispatch, pass/fail exit."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_verification"
path = "src/lib.rs"

[dependencies]
narf-kernel-test  = { path = "kernel-test" }
narf-lib         = { path = "../lib" }
narf-acpi        = { path = "../acpi" }
narf-aml         = { path = "../aml" }
narf-arch        = { path = "../arch" }
narf-memory      = { path = "../memory" }
narf-scheduler   = { path = "../scheduler" }
narf-capabilities = { path = "../capabilities" }
narf-tracing    = { path = "../tracing" }
narf-bpf        = { path = "../bpf" }
narf-bpf-structops = { path = "../bpf/structops" }
narf-bpf-idle   = { path = "../bpf-idle" }
narf-bpf-leds   = { path = "../bpf-leds" }
narf-bus        = { path = "../bus" }
narf-boot       = { path = "../boot" }
narf-rcu        = { path = "../rcu" }
narf-ipc        = { path = "../ipc" }
narf-abi        = { path = "../abi" }
narf-io         = { path = "../io" }
narf-drivers    = { path = "../drivers" }
narf-drivers-virtio = { path = "../drivers/virtio" }
narf-input        = { path = "../input" }
narf-input-driver = { path = "../drivers/input" }
narf-graphics     = { path = "../graphics" }
narf-graphics-driver = { path = "../drivers/graphics" }
narf-init         = { path = "../init" }
narf-fb           = { path = "../fb" }
narf-audio        = { path = "../audio" }
narf-wireless     = { path = "../wireless" }
narf-accel        = { path = "../accel" }
narf-tpm          = { path = "../tpm" }
narf-i3c          = { path = "../i3c" }
narf-shmem        = { path = "../shmem" }
narf-firmware     = { path = "../firmware" }
narf-firmware-fw-cfg = { path = "../firmware/fw_cfg" }
narf-firmware-smbios = { path = "../firmware/smbios" }
narf-block      = { path = "../block" }
narf-console    = { path = "../console" }
narf-interrupts = { path = "../interrupts" }
narf-time       = { path = "../time" }
narf-crypto     = { path = "../crypto" }
narf-net        = { path = "../net" }
narf-filesystem = { path = "../filesystem" }
narf-power      = { path = "../power" }
narf-observability = { path = "../observability" }
narf-userspace  = { path = "../userspace" }
# Optional: pulled in only under `boot-init` so default builds
# don't trigger the busybox download + make. Falls back to an
# empty slice when musl-gcc isn't on the host (see busybox
# crate's build.rs).
narf-busybox    = { path = "busybox", optional = true }
narf-drivers-nvme = { path = "../drivers/nvme" }
narf-drivers-net  = { path = "../drivers/net" }
narf-drivers-gpu  = { path = "../drivers/gpu" }
narf-drivers-storage = { path = "../drivers/storage" }
narf-drivers-usb     = { path = "../drivers/usb" }
narf-drivers-thunderbolt = { path = "../drivers/thunderbolt" }
narf-drivers-fingerprint = { path = "../drivers/fingerprint" }
narf-drivers-platform = { path = "../drivers/platform" }
narf-drivers-sound = { path = "../drivers/sound" }
narf-drivers-hwmon   = { path = "../drivers/hwmon", features = ["kernel-test"] }
narf-drivers-extcon  = { path = "../drivers/extcon", features = ["kernel-test"] }
narf-compat-win   = { path = "../compat/win" }
narf-modules      = { path = "../modules" }

[features]
# Opt-in end-to-end user-mode smoke tests. Enabling this adds the
# user-mode round-trip / yield-resume / poll_yield_exit / future
# yield_exit smokes that build a user AS, issue `int 0x80`, and
# longjmp back without terminating the kernel. Disabled by default
# because the tests leave subsystem state that other suites don't
# need to pay for; enable with
# `cargo xtask test --arch=x86_64 --features=user-mode-e2e`.
user-mode-e2e = []
# Opt-in real-Rust-binary end-to-end test. This implies
# `user-mode-e2e` and additionally enables
# `smoke_frame_x86_64_run_narf_testbin`, which loads the
# `narf-testbin` ELF (built by `verification/build.rs` only when this
# feature is on), enters user mode, and on success calls
# `narf_arch::exit_kernel(0)` — terminating the kernel by design.
# That kernel-exit is why this is split out: enabling it shadows any
# tests that would have run after it.
user-mode-testbin = ["user-mode-e2e", "boot-init"]
# Boot-time userspace init: build `userspace/init` and
# `userspace/shell` ELFs and expose them as `NARF_INIT_ELF` /
# `NARF_SHELL_ELF` consts. Doesn't imply the kernel-test harness —
# `narf-frame` consumes the consts in its production `run_async_demo`
# path so init can actually be loaded + spawned at boot.
boot-init = ["dep:narf-busybox"]
# Opt-in narf-libc validate-binary runner. Like user-mode-testbin,
# this builds + loads a real Rust user binary — but the binary is
# linked against `narf-libc` (the relibc-shaped libc shim) rather
# than calling `narf-user-runtime` directly. Implies user-mode-e2e
# so the entry/longjmp plumbing is in scope. The runner exits the
# kernel on success (same shape as user-mode-testbin).
narf-libc-validate = ["user-mode-e2e"]

[lints]
workspace = true
