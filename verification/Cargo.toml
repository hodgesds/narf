[package]
name         = "narf-verification"
description  = "Kernel-test harness: #[kernel_test] collector, runtime dispatch, pass/fail exit."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_verification"
path = "src/lib.rs"

[dependencies]
narf-kernel-test  = { path = "kernel-test", version = "0.1.0" }
narf-lib         = { path = "../lib", version = "0.1.0" }
narf-acpi        = { path = "../acpi", version = "0.1.0" }
narf-aml         = { path = "../aml", version = "0.1.0" }
narf-arch        = { path = "../arch", version = "0.1.0" }
narf-memory      = { path = "../memory", version = "0.1.0" }
narf-scheduler   = { path = "../scheduler", version = "0.1.0" }
narf-capabilities = { path = "../capabilities", version = "0.1.0" }
narf-tracing    = { path = "../tracing", version = "0.1.0" }
narf-bpf        = { path = "../bpf", version = "0.1.0" }
narf-bpf-structops = { path = "../bpf/structops", version = "0.1.0" }
narf-bpf-idle   = { path = "../bpf-idle", version = "0.1.0" }
narf-bpf-leds   = { path = "../bpf-leds", version = "0.1.0" }
narf-bus        = { path = "../bus", version = "0.1.0" }
narf-boot       = { path = "../boot", version = "0.1.0" }
narf-rcu        = { path = "../rcu", version = "0.1.0" }
narf-ipc        = { path = "../ipc", version = "0.1.0" }
narf-abi        = { path = "../abi", version = "0.1.0" }
narf-io         = { path = "../io", version = "0.1.0" }
narf-drivers    = { path = "../drivers", version = "0.1.0" }
narf-drivers-virtio = { path = "../drivers/virtio", version = "0.1.0" }
narf-input        = { path = "../input", version = "0.1.0" }
narf-input-driver = { path = "../drivers/input", version = "0.1.0" }
narf-graphics     = { path = "../graphics", version = "0.1.0" }
narf-graphics-driver = { path = "../drivers/graphics", version = "0.1.0" }
narf-init         = { path = "../init", version = "0.1.0" }
narf-fb           = { path = "../fb", version = "0.1.0" }
narf-audio        = { path = "../audio", version = "0.1.0" }
narf-wireless     = { path = "../wireless", version = "0.1.0" }
narf-accel        = { path = "../accel", version = "0.1.0" }
narf-tpm          = { path = "../tpm", version = "0.1.0" }
narf-i3c          = { path = "../i3c", version = "0.1.0" }
narf-shmem        = { path = "../shmem", version = "0.1.0" }
narf-firmware     = { path = "../firmware", version = "0.1.0" }
narf-firmware-fw-cfg = { path = "../firmware/fw_cfg", version = "0.1.0" }
narf-firmware-smbios = { path = "../firmware/smbios", version = "0.1.0" }
narf-block      = { path = "../block", version = "0.1.0" }
narf-console    = { path = "../console", version = "0.1.0" }
narf-interrupts = { path = "../interrupts", version = "0.1.0" }
narf-time       = { path = "../time", version = "0.1.0" }
narf-crypto     = { path = "../crypto", version = "0.1.0" }
narf-net        = { path = "../net", version = "0.1.0" }
narf-filesystem = { path = "../filesystem", version = "0.1.0" }
narf-power      = { path = "../power", version = "0.1.0" }
narf-observability = { path = "../observability", version = "0.1.0" }
narf-userspace  = { path = "../userspace", version = "0.1.0" }
# Optional: pulled in only under `boot-init` so default builds
# don't trigger the busybox download + make. Falls back to an
# empty slice when musl-gcc isn't on the host (see busybox
# crate's build.rs).
narf-busybox    = { path = "busybox", version = "0.1.0", optional = true }
narf-drivers-nvme = { path = "../drivers/nvme", version = "0.1.0" }
narf-drivers-net  = { path = "../drivers/net", version = "0.1.0" }
narf-drivers-gpu  = { path = "../drivers/gpu", version = "0.1.0" }
narf-drivers-storage = { path = "../drivers/storage", version = "0.1.0" }
narf-drivers-usb     = { path = "../drivers/usb", version = "0.1.0" }
narf-drivers-thunderbolt = { path = "../drivers/thunderbolt", version = "0.1.0" }
narf-drivers-fingerprint = { path = "../drivers/fingerprint", version = "0.1.0" }
narf-drivers-platform = { path = "../drivers/platform", version = "0.1.0" }
narf-drivers-sound = { path = "../drivers/sound", version = "0.1.0" }
narf-drivers-hwmon   = { path = "../drivers/hwmon", version = "0.1.0", features = ["kernel-test"] }
narf-drivers-extcon  = { path = "../drivers/extcon", version = "0.1.0", features = ["kernel-test"] }
narf-compat-win   = { path = "../compat/win", version = "0.1.0" }
narf-modules      = { path = "../modules", version = "0.1.0" }

[features]
# Opt-in end-to-end user-mode smoke tests. Enabling this adds the
# user-mode round-trip / yield-resume / poll_yield_exit / future
# yield_exit smokes that build a user AS, issue `int 0x80`, and
# longjmp back without terminating the kernel. Disabled by default
# because the tests leave subsystem state that other suites don't
# need to pay for; enable with
# `cargo xtask test --arch=x86_64 --features=user-mode-e2e`.
user-mode-e2e = []
# Opt-in real-Rust-binary end-to-end test. This implies
# `user-mode-e2e` and additionally enables
# `smoke_frame_x86_64_run_narf_testbin`, which loads the
# `narf-testbin` ELF (built by `verification/build.rs` only when this
# feature is on), enters user mode, and on success calls
# `narf_arch::exit_kernel(0)` — terminating the kernel by design.
# That kernel-exit is why this is split out: enabling it shadows any
# tests that would have run after it.
user-mode-testbin = ["user-mode-e2e", "boot-init"]
# Boot-time userspace init: build `userspace/init` and
# `userspace/shell` ELFs and expose them as `NARF_INIT_ELF` /
# `NARF_SHELL_ELF` consts. Doesn't imply the kernel-test harness —
# `narf-frame` consumes the consts in its production `run_async_demo`
# path so init can actually be loaded + spawned at boot.
boot-init = ["dep:narf-busybox"]
# Opt-in narf-libc validate-binary runner. Like user-mode-testbin,
# this builds + loads a real Rust user binary — but the binary is
# linked against `narf-libc` (the relibc-shaped libc shim) rather
# than calling `narf-user-runtime` directly. Implies user-mode-e2e
# so the entry/longjmp plumbing is in scope. The runner exits the
# kernel on success (same shape as user-mode-testbin).
narf-libc-validate = ["user-mode-e2e"]

[lints]
workspace = true
