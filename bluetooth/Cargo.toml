[package]
name         = "narf-bluetooth"
description  = "Bluetooth Host Controller Interface — clean-room from public Bluetooth SIG specs."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_bluetooth"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-capabilities = { path = "../capabilities" }
narf-bus          = { path = "../bus" }
narf-io           = { path = "../io" }
narf-firmware     = { path = "../firmware" }
narf-efi          = { path = "../efi" }
narf-console      = { path = "../console" }
narf-drivers      = { path = "../drivers" }
narf-filesystem   = { path = "../filesystem" }
narf-scheduler    = { path = "../scheduler" }
narf-time         = { path = "../time" }
narf-init         = { path = "../init" }
narf-audio        = { path = "../audio" }
narf-kernel-test  = { path = "../verification/kernel-test" }

[features]
kernel-test = []

[lints]
workspace = true
