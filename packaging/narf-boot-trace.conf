# OpenRC sources this file from /etc/rc.conf.d during early sysinit.
# Sample only for an installed OpenRC boot that explicitly requests disk logs.
case "$0" in
    */rc/sh/init.sh)
        (
            IFS= read -r cmdline </proc/cmdline || [ -n "$cmdline" ] || exit 0
            case " $cmdline " in *" openrc_pid1 "*) ;; *) exit 0 ;; esac
            case " $cmdline " in *" narf.rootlog "*) ;; *) exit 0 ;; esac
            umask 077
            log=$(mktemp /var/log/narf-openrc-XXXXXX) || exit 1
            exec >>"$log"
            printf 'OpenRC entered sysinit\n'
            sync "$log" /var/log
            for delay in 0 3 7 15 30 60 120; do
                [ "$delay" = 0 ] || sleep "$delay"
                IFS=' ' read -r uptime unused </proc/uptime
                level=unknown
                if [ -r /run/openrc/softlevel ]; then
                    IFS= read -r level </run/openrc/softlevel
                fi
                printf '\nuptime=%s runlevel=%s\n' "$uptime" "$level"
                for state in starting started failed inactive; do
                    printf '%s' "$state"
                    for svc in /run/openrc/"$state"/*; do
                        [ -L "$svc" ] && printf ' %s' "${svc##*/}"
                    done
                    printf '\n'
                done
                printf 'network links and packet counters\n'
                ip -s link show
                for link in /sys/class/net/*; do
                    [ -r "$link/carrier" ] || continue
                    printf '%s carrier=' "${link##*/}"
                    cat "$link/carrier" || printf 'unknown\n'
                done
                printf 'IPv4 addresses and routes\n'
                ip -o -4 addr show
                ip -4 route show
                printf 'SSH listeners (local address in procfs format)\n'
                for tcp_table in /proc/net/tcp /proc/net/tcp6; do
                    [ -r "$tcp_table" ] || continue
                    awk '$2 ~ /:0016$/ && $4 == "0A" { print FILENAME, $2 }' "$tcp_table"
                done
                count=0
                for task in /proc/[0-9]*; do
                    [ -r "$task/comm" ] || continue
                    comm=
                    IFS= read -r comm <"$task/comm" || [ -n "$comm" ] || continue
                    wait=unknown
                    if [ -r "$task/wchan" ]; then
                        IFS= read -r wait <"$task/wchan" || :
                    fi
                    printf '%s %.16s %.64s\n' "${task##*/}" "$comm" "$wait"
                    count=$((count + 1))
                    [ "$count" -lt 128 ] || break
                done
                sync "$log"
            done
        ) </dev/null >/dev/null 2>&1 &
        ;;
esac
