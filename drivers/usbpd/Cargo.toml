[package]
name         = "narf-drivers-usbpd"
description  = "USB-PD TCPC drivers (FUSB302). Clean-room from public silicon datasheets."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_usbpd"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib", version = "0.1.0" }
narf-usbpd        = { path = "../../usbpd", version = "0.1.0" }
narf-capabilities = { path = "../../capabilities", version = "0.1.0" }
narf-scheduler    = { path = "../../scheduler", version = "0.1.0" }
narf-time         = { path = "../../time", version = "0.1.0" }
narf-init         = { path = "../../init", version = "0.1.0" }
narf-console      = { path = "../../console", version = "0.1.0" }
narf-drivers-i2c  = { path = "../i2c", version = "0.1.0" }
narf-kernel-test  = { path = "../../verification/kernel-test", version = "0.1.0" }

[features]
kernel-test = []

[lints]
workspace = true
