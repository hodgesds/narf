[package]
name         = "narf-drivers-nvme"
description  = "NVMe host driver skeleton — Stage-4 primary."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_nvme"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-capabilities = { path = "../../capabilities" }
narf-io           = { path = "../../io" }
narf-memory       = { path = "../../memory" }
narf-block        = { path = "../../block" }
narf-bus          = { path = "../../bus" }
narf-interrupts   = { path = "../../interrupts" }
narf-scheduler    = { path = "../../scheduler" }
narf-time         = { path = "../../time" }
narf-drivers      = { path = "../../drivers" }
narf-init         = { path = "../../init" }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-arch         = { path = "../../arch" }
narf-power        = { path = "../../power" }

[features]
# Compile the in-kernel smokes (`src/tests.rs`) and the test hooks they
# drive. Enabled by `narf-frame/kernel-test`; production builds leave it
# off, so the hooks do not exist there.
kernel-test = []

[lints]
workspace = true
