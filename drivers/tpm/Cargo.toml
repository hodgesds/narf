[package]
name         = "narf-drivers-tpm"
description  = "TPM 2.0 extension surface — extended command set + devfs/sysfs bridges staged for composition onto the canonical narf-tpm + drivers/platform stack (#934). Not a production transport."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_tpm"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-filesystem   = { path = "../../filesystem" }
narf-block        = { path = "../../block" }
# The canonical protocol crate: the sysfs bridge serves the TCG
# event log through narf-tpm's attestation hooks (#945). Depending
# on the canonical crate is the composition direction (#934) — the
# bridges remain consumers of it, never a second stack.
narf-tpm          = { path = "../../tpm" }

[features]
kernel-test = []

[lints]
workspace = true
