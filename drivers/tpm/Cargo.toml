[package]
name         = "narf-drivers-tpm"
description  = "TPM 2.0 extension surface — extended command set + devfs/sysfs bridges staged for composition onto the canonical narf-tpm + drivers/platform stack (#934). Not a production transport."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_tpm"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-filesystem   = { path = "../../filesystem" }
narf-block        = { path = "../../block" }

[features]
kernel-test = []
# Exposes the spec-shaped FixtureTpm command core (#1002) to a
# consumer crate's fixture suite (narf-power's TPM anchor tests
# forward it from their own kernel-test feature).
fixture-tpm = []

[lints]
workspace = true
