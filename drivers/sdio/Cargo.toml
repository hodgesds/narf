[package]
name         = "narf-drivers-sdio"
description  = "SDHCI SDIO host controller driver — PCI class 0x080500, CMD52/CMD53, CCCR/FBR/CIS."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_sdio"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-capabilities = { path = "../../capabilities" }
narf-io           = { path = "../../io" }
narf-bus          = { path = "../../bus" }
narf-interrupts   = { path = "../../interrupts" }
narf-memory       = { path = "../../memory" }
narf-drivers      = { path = "../" }
narf-driver-runtime = { path = "../runtime", default-features = false, features = ["kernel"] }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-console      = { path = "../../console" }
narf-time         = { path = "../../time" }

[features]
kernel-test = []

[lints]
workspace = true
