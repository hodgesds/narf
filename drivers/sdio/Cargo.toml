[package]
name         = "narf-drivers-sdio"
description  = "SDHCI SDIO host controller driver — PCI class 0x080500, CMD52/CMD53, CCCR/FBR/CIS."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_sdio"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib", version = "0.1.0" }
narf-capabilities = { path = "../../capabilities", version = "0.1.0" }
narf-io           = { path = "../../io", version = "0.1.0" }
narf-bus          = { path = "../../bus", version = "0.1.0" }
narf-interrupts   = { path = "../../interrupts", version = "0.1.0" }
narf-memory       = { path = "../../memory", version = "0.1.0" }
narf-drivers      = { path = "../", version = "0.1.0" }
narf-driver-runtime = { path = "../runtime", version = "0.1.0", default-features = false, features = ["kernel"] }
narf-kernel-test  = { path = "../../verification/kernel-test", version = "0.1.0" }
narf-console      = { path = "../../console", version = "0.1.0" }
narf-time         = { path = "../../time", version = "0.1.0" }

[features]
kernel-test = []

[lints]
workspace = true
