[package]
name         = "narf-drivers-backlight"
description  = "Display backlight + keyboard backlight + brightness-key subsystem."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_backlight"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-capabilities = { path = "../../capabilities" }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-aml          = { path = "../../aml" }
narf-input        = { path = "../../input" }
narf-console      = { path = "../../console" }
narf-init         = { path = "../../init" }
narf-scheduler    = { path = "../../scheduler" }
narf-time         = { path = "../../time" }
narf-drivers-leds = { path = "../leds" }
narf-filesystem   = { path = "../../filesystem" }
narf-driver-runtime = { path = "../runtime", default-features = false, features = ["kernel"] }
narf-memory       = { path = "../../memory" }

[features]
kernel-test = ["narf-drivers-leds/kernel-test"]

[lints]
workspace = true
