[package]
name         = "narf-drivers-pwm-lpss"
description  = "Intel Low Power Subsystem (LPSS) PWM controller driver (Bay Trail / Braswell / Broxton / Tangier)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_pwm_lpss"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-bus          = { path = "../../bus" }
narf-memory       = { path = "../../memory" }
narf-capabilities = { path = "../../capabilities" }
narf-console      = { path = "../../console" }
narf-init         = { path = "../../init" }
narf-pwm          = { path = "../../pwm" }
narf-firmware-fdt = { path = "../../firmware/fdt" }
narf-scheduler    = { path = "../../scheduler" }
narf-kernel-test  = { path = "../../verification/kernel-test" }
async-trait       = "0.1"

[features]
kernel-test = []

[lints]
workspace = true
