# bnxt — Broadcom NetXtreme-C/E NIC, dual-build (built-in or loadable .ko).
# See narf-drivers-net-e1000 for the reference shape.

[package]
name         = "narf-drivers-net-bnxt"
description  = "Broadcom NetXtreme-C/E NIC — built-in or loadable module."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_net_bnxt"
path = "src/lib.rs"

[features]
default = ["builtin"]
builtin = [
    "dep:narf-drivers-net-core", "dep:narf-arch", "dep:narf-bus",
    "dep:narf-capabilities", "dep:narf-console", "dep:narf-driver-runtime",
    "dep:narf-drivers", "dep:narf-firmware", "dep:narf-interrupts",
    "dep:narf-io", "dep:narf-ipc", "dep:narf-kernel-test", "dep:narf-lib",
    "dep:narf-memory", "dep:narf-net", "dep:narf-scheduler", "dep:narf-time",
]
module = []

[dependencies]
narf-driver-macros = { path = "../../../driver-macros" }
narf-drivers-net-core = { path = "../core", optional = true }
narf-arch         = { path = "../../../arch", optional = true }
narf-bus          = { path = "../../../bus", optional = true }
narf-capabilities = { path = "../../../capabilities", optional = true }
narf-console      = { path = "../../../console", optional = true }
narf-driver-runtime = { path = "../../runtime", optional = true, default-features = false, features = ["kernel"] }
narf-drivers      = { path = "../..", optional = true }
narf-firmware     = { path = "../../../firmware", optional = true }
narf-interrupts   = { path = "../../../interrupts", optional = true }
narf-io           = { path = "../../../io", optional = true }
narf-ipc          = { path = "../../../ipc", optional = true }
narf-kernel-test  = { path = "../../../verification/kernel-test", optional = true }
narf-lib          = { path = "../../../lib", optional = true }
narf-memory       = { path = "../../../memory", optional = true }
narf-net          = { path = "../../../net", optional = true }
narf-scheduler    = { path = "../../../scheduler", optional = true }
narf-time         = { path = "../../../time", optional = true }

[lints]
workspace = true
