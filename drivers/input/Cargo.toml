[package]
name         = "narf-input-driver"
description  = "Input drivers: i8042 PS/2 keyboard (x86_64) + future."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_input_driver"
path = "src/lib.rs"

[dependencies]
narf-lib            = { path = "../../lib" }
narf-input          = { path = "../../input" }
narf-arch           = { path = "../../arch" }
narf-interrupts     = { path = "../../interrupts" }
narf-acpi           = { path = "../../acpi" }
narf-drivers        = { path = "../../drivers" }
narf-init           = { path = "../../init" }
narf-drivers-i2c    = { path = "../i2c" }
narf-drivers-gpio   = { path = "../gpio" }
narf-hid            = { path = "../../hid" }
narf-scheduler      = { path = "../../scheduler" }
narf-aml            = { path = "../../aml" }
narf-fb             = { path = "../../fb" }
narf-console        = { path = "../../console" }
narf-drivers-virtio = { path = "../virtio" }
narf-kernel-test    = { path = "../../verification/kernel-test" }
async-trait         = "0.1"

[lints]
workspace = true
