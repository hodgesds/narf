[package]
name         = "narf-drivers-hwmon"
description  = "Hardware monitoring drivers: k10temp (AMD), coretemp (Intel), nct6775 (Nuvoton Super-I/O), dell_smm."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_hwmon"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib", version = "0.1.0" }
narf-bus          = { path = "../../bus", version = "0.1.0" }
narf-arch         = { path = "../../arch", version = "0.1.0" }
narf-capabilities = { path = "../../capabilities", version = "0.1.0" }
narf-console      = { path = "../../console", version = "0.1.0" }
narf-filesystem   = { path = "../../filesystem", version = "0.1.0" }
narf-init         = { path = "../../init", version = "0.1.0" }
narf-kernel-test  = { path = "../../verification/kernel-test", version = "0.1.0" }
narf-firmware-smbios = { path = "../../firmware/smbios", version = "0.1.0" }
narf-aml          = { path = "../../aml", version = "0.1.0" }

[features]
linux-compat = ["narf-filesystem/linux-compat"]
kernel-test = []

[lints]
workspace = true
