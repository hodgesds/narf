# Realtek RTW88/RTW89 Wi-Fi family — dual-build.
#
# One family crate for the two modern Realtek PCIe Wi-Fi drivers, promoted from
# the former `drivers/wireless/src/{rtw88,rtw89}/` modules. rtw89 reuses
# rtw88's `pci_park` helper, so they live in one crate (the inner module paths
# `rtw88`/`rtw89` are preserved). rtw88's USB datapath shares the transport
# primitives in `narf-drivers-wireless-rtl-usb`.
#
#   * `builtin` (default): rlib dependency of the `narf-drivers-wireless`
#     facade, registered from the kernel's Stage::Subsys initcalls.
#   * `module`: built to a loadable `.ko` via `cargo xtask build-module
#     --package narf-drivers-wireless-rtw --no-default-features --features
#     module`. The rtw88 driver source runs inside the `.ko` for the USB
#     parts (RTL8821CU/RTL8822BU) over `narf-module-rt`, the kernel-free
#     protocol crates and the KABI (`src/rtw88/platform/`); the rtw88 and
#     rtw89 PCIe ids stay registration-only (their probe returns -ENOSYS).
#
# Tests gate on a dedicated `kernel-test` feature implying `builtin`.

[package]
name         = "narf-drivers-wireless-rtw"
description  = "Realtek RTW88/RTW89 PCIe Wi-Fi family — built-in or loadable module."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_wireless_rtw"
path = "src/lib.rs"

[features]
default = ["builtin"]
builtin = [
    "dep:narf-bus", "dep:narf-capabilities", "dep:narf-console",
    "dep:narf-crypto", "dep:narf-drivers", "dep:narf-drivers-usb",
    "dep:narf-drivers-wireless-core", "dep:narf-drivers-wireless-rtl-usb",
    "dep:narf-firmware", "dep:narf-init", "dep:narf-interrupts",
    "dep:narf-io", "dep:narf-ipc", "dep:narf-lib", "dep:narf-memory",
    "dep:narf-net", "dep:narf-power", "dep:narf-scheduler", "dep:narf-time",
    "dep:narf-wireless", "dep:zeroize",
    "narf-crypto/kernel", "narf-wireless/kernel",
]
# The loadable driver: the kernel-free protocol crates and the module
# runtime, linked into the `.ko`; everything else comes through the KABI.
module = [
    "dep:narf-module-rt", "dep:narf-crypto", "dep:narf-wireless", "dep:zeroize",
]
kernel-test = [
    "builtin",
    "dep:narf-kernel-test", "dep:narf-wifi-fixtures",
    "narf-wireless/kernel-test", "narf-bus/kernel-test",
    "narf-power/wake-test", "narf-drivers-wireless-core/kernel-test",
    "narf-drivers-wireless-rtl-usb/kernel-test",
]

[dependencies]
narf-driver-macros = { path = "../../../driver-macros" }
async-trait        = "0.1"
# Transport-agnostic chip register-programming core (`RegIo`). Kernel-crate-
# free, so it links in the `module` build too; the MAC/PHY/RF/station bring-up
# migrates onto it (see the datapath design doc).
narf-drivers-wireless-rtl-chip = { path = "../rtl-chip" }

narf-bus          = { path = "../../../bus", optional = true }
narf-capabilities = { path = "../../../capabilities", optional = true }
narf-console      = { path = "../../../console", optional = true }
narf-crypto       = { path = "../../../crypto", optional = true, default-features = false }
narf-drivers      = { path = "../..", optional = true }
narf-drivers-usb  = { path = "../../usb", optional = true }
narf-drivers-wireless-core = { path = "../core", optional = true }
narf-drivers-wireless-rtl-usb = { path = "../rtl-usb", optional = true }
narf-firmware     = { path = "../../../firmware", optional = true }
narf-init         = { path = "../../../init", optional = true }
narf-interrupts   = { path = "../../../interrupts", optional = true }
narf-io           = { path = "../../../io", optional = true }
narf-ipc          = { path = "../../../ipc", optional = true }
narf-lib          = { path = "../../../lib", optional = true }
narf-memory       = { path = "../../../memory", optional = true }
narf-net          = { path = "../../../net", optional = true }
narf-power        = { path = "../../../power", optional = true }
narf-scheduler    = { path = "../../../scheduler", optional = true }
narf-time         = { path = "../../../time", optional = true }
narf-wireless     = { path = "../../../wireless", optional = true, default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }
narf-module-rt = { path = "../../../modules/rt", optional = true }

narf-kernel-test   = { path = "../../../verification/kernel-test", optional = true }
narf-wifi-fixtures = { path = "../../../verification/wifi-fixtures", optional = true }

[lints]
workspace = true
