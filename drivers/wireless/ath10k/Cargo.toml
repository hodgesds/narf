# Qualcomm Atheros ath10k PCIe Wi-Fi — dual-build.
#
# Promoted from the former `drivers/wireless/src/ath10k/` module into a proper
# per-driver crate, depending on `narf-drivers-wireless-ath-core` for the shared
# Qualcomm/Atheros code (qualcomm_pci, qualcomm_regulatory, eth QoS, SMBIOS
# board id, WMI NLO types). Builds built-in or as a loadable `.ko`, like
# `drivers/wireless/iwlwifi/` and `drivers/net/tg3/`.
#
#   * `builtin` (default): rlib dependency of the `narf-drivers-wireless`
#     facade, registered from the kernel's Stage::Subsys initcall.
#   * `module`: built to a loadable `.ko` via `cargo xtask build-module
#     --package narf-drivers-wireless-ath10k --no-default-features --features
#     module`. The same driver source runs inside the `.ko` over
#     `narf-module-rt` and the KABI (`src/ath10k/platform/`): BMI, firmware
#     and board download, CE, HTC, WMI, HTT and the station path, PCIe only.
#
# Tests gate on a dedicated `kernel-test` feature implying `builtin`.

[package]
name         = "narf-drivers-wireless-ath10k"
description  = "Qualcomm Atheros ath10k PCIe Wi-Fi (QCA988X/9887/6174/99X0/9984/9377/…) — built-in or loadable module."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_wireless_ath10k"
path = "src/lib.rs"

[features]
default = ["builtin"]
builtin = [
    "dep:narf-bus", "dep:narf-capabilities", "dep:narf-console",
    "dep:narf-crypto", "dep:narf-drivers", "dep:narf-drivers-wireless-ath-core",
    "dep:narf-drivers-wireless-core", "dep:narf-firmware",
    "dep:narf-firmware-fdt", "dep:narf-interrupts", "dep:narf-io",
    "dep:narf-ipc", "dep:narf-lib", "dep:narf-memory", "dep:narf-net",
    "dep:narf-power", "dep:narf-scheduler", "dep:narf-time",
    "dep:narf-wireless", "dep:zeroize",
    "narf-crypto/kernel", "narf-wireless/kernel",
    "narf-drivers-wireless-ath-core/kernel",
]
# The loadable driver: the kernel-free protocol crates and the module
# runtime, linked into the `.ko`; everything else comes through the KABI.
module = [
    "dep:narf-module-rt", "dep:narf-crypto", "dep:narf-wireless",
    "dep:narf-drivers-wireless-ath-core", "dep:zeroize",
]
kernel-test = [
    "builtin",
    "dep:narf-kernel-test", "dep:narf-wifi-fixtures",
    "narf-wireless/kernel-test", "narf-bus/kernel-test",
    "narf-power/wake-test", "narf-drivers-wireless-core/kernel-test",
    "narf-drivers-wireless-ath-core/kernel-test",
]

[dependencies]
narf-driver-macros = { path = "../../../driver-macros" }
async-trait        = "0.1"

narf-bus          = { path = "../../../bus", optional = true }
narf-capabilities = { path = "../../../capabilities", optional = true }
narf-console      = { path = "../../../console", optional = true }
narf-crypto       = { path = "../../../crypto", optional = true, default-features = false }
narf-drivers      = { path = "../..", optional = true }
narf-drivers-wireless-ath-core = { path = "../ath-core", optional = true, default-features = false }
narf-drivers-wireless-core = { path = "../core", optional = true }
narf-firmware     = { path = "../../../firmware", optional = true }
narf-firmware-fdt = { path = "../../../firmware/fdt", optional = true }
narf-interrupts   = { path = "../../../interrupts", optional = true }
narf-io           = { path = "../../../io", optional = true }
narf-ipc          = { path = "../../../ipc", optional = true }
narf-lib          = { path = "../../../lib", optional = true }
narf-memory       = { path = "../../../memory", optional = true }
narf-net          = { path = "../../../net", optional = true }
narf-power        = { path = "../../../power", optional = true }
narf-scheduler    = { path = "../../../scheduler", optional = true }
narf-time         = { path = "../../../time", optional = true }
narf-wireless     = { path = "../../../wireless", optional = true, default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }
narf-module-rt = { path = "../../../modules/rt", optional = true }

narf-kernel-test   = { path = "../../../verification/kernel-test", optional = true }
narf-wifi-fixtures = { path = "../../../verification/wifi-fixtures", optional = true }

[lints]
workspace = true
