[package]
name         = "narf-drivers-wireless"
description  = "Hardware Wireless drivers (MT7921) skeleton — Stage-4."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_wireless"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-capabilities = { path = "../../capabilities" }
narf-io           = { path = "../../io" }
narf-ipc          = { path = "../../ipc" }
narf-time         = { path = "../../time" }
narf-wireless     = { path = "../../wireless" }
narf-net          = { path = "../../net" }
narf-bus          = { path = "../../bus" }
narf-interrupts   = { path = "../../interrupts" }
narf-memory       = { path = "../../memory" }
narf-drivers      = { path = "../" }
narf-driver-runtime = { path = "../runtime", default-features = false, features = ["kernel"] }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-wifi-fixtures = { path = "../../verification/wifi-fixtures" }
narf-scheduler    = { path = "../../scheduler" }
narf-console      = { path = "../../console" }
narf-firmware     = { path = "../../firmware" }
narf-firmware-smbios = { path = "../../firmware/smbios" }
narf-firmware-fdt = { path = "../../firmware/fdt" }
narf-crypto      = { path = "../../crypto" }
narf-boot         = { path = "../../boot" }
narf-init         = { path = "../../init" }
narf-power        = { path = "../../power" }
narf-drivers-sdio = { path = "../sdio" }
narf-drivers-usb  = { path = "../usb" }
# Per-driver crate (promoted from the former src/mt7921/ module). Built-in
# here; the same crate also builds to a loadable `.ko` via `cargo xtask
# build-module`. See drivers/wireless/mt76/ and drivers/net/i40e/ (template).
narf-drivers-wireless-mt76 = { path = "mt76", default-features = false, features = ["builtin"] }
async-trait = "0.1"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[features]
kernel-test = ["narf-drivers-sdio/kernel-test", "narf-wireless/kernel-test"]

[lints]
workspace = true
