[package]
name         = "narf-drivers-wireless"
description  = "Hardware Wireless drivers (MT7921) skeleton — Stage-4."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_wireless"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-capabilities = { path = "../../capabilities" }
narf-io           = { path = "../../io" }
narf-ipc          = { path = "../../ipc" }
narf-time         = { path = "../../time" }
narf-wireless     = { path = "../../wireless" }
narf-net          = { path = "../../net" }
narf-bus          = { path = "../../bus" }
narf-interrupts   = { path = "../../interrupts" }
narf-memory       = { path = "../../memory" }
narf-drivers      = { path = "../" }
narf-driver-runtime = { path = "../runtime", default-features = false, features = ["kernel"] }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-wifi-fixtures = { path = "../../verification/wifi-fixtures" }
narf-scheduler    = { path = "../../scheduler" }
narf-console      = { path = "../../console" }
narf-firmware     = { path = "../../firmware" }
narf-firmware-smbios = { path = "../../firmware/smbios" }
narf-firmware-fdt = { path = "../../firmware/fdt" }
narf-drivers-qcom-soc = { path = "../soc/qcom" }
narf-crypto      = { path = "../../crypto" }
narf-boot         = { path = "../../boot" }
narf-init         = { path = "../../init" }
narf-power        = { path = "../../power" }
narf-aml          = { path = "../../aml" }
narf-drivers-sdio = { path = "../sdio" }
narf-drivers-spi  = { path = "../spi" }
narf-drivers-usb  = { path = "../usb" }
# The rfkill core and /dev/rfkill: each wiphy is one wlan radio.
narf-drivers-platform = { path = "../platform" }
# Per-driver crate (promoted from the former src/mt7921/ module). Built-in
# here; the same crate also builds to a loadable `.ko` via `cargo xtask
# build-module`. See drivers/wireless/mt76/ and drivers/net/i40e/ (template).
narf-drivers-wireless-mt76 = { path = "mt76", default-features = false, features = ["builtin"] }
# Intel iwlwifi (promoted from the former src/iwlwifi/ module). Built-in here;
# the same crate builds to a loadable `.ko` via `cargo xtask build-module`.
narf-drivers-wireless-iwlwifi = { path = "iwlwifi", default-features = false, features = ["builtin"] }
# Realtek RTW88/RTW89 family (promoted from the former src/{rtw88,rtw89}/).
narf-drivers-wireless-rtw = { path = "rtw", default-features = false, features = ["builtin"] }
# Shared driver-agnostic helpers (firmware_asset, future_heap), re-exported
# from the crate root for the still-inlined drivers.
narf-drivers-wireless-core = { path = "core" }
# Shared Atheros/Qualcomm code (qualcomm_pci/regulatory + eth/board/wmi_nlo),
# re-exported from the crate root for the still-inlined ath9k/ath10k/ath11k.
narf-drivers-wireless-ath-core = { path = "ath-core" }
# Qualcomm Atheros ath9k (promoted from the former src/ath9k{.rs,/}).
narf-drivers-wireless-ath9k = { path = "ath9k", default-features = false, features = ["builtin"] }
# Qualcomm Atheros ath10k (promoted from the former src/ath10k/).
narf-drivers-wireless-ath10k = { path = "ath10k", default-features = false, features = ["builtin"] }
# Qualcomm ath11k Wi-Fi 6 (promoted from the former src/ath11k/).
narf-drivers-wireless-ath11k = { path = "ath11k", default-features = false, features = ["builtin"] }
# Broadcom/Infineon FullMAC family (promoted from the former
# src/{brcmfmac,cyw43439}/): brcmfmac PCIe + CYW43439 SDIO in one family crate.
narf-drivers-wireless-brcm = { path = "brcm", default-features = false, features = ["builtin"] }
# Shared Realtek USB transport primitives (Io/ControlIo/UsbIo/UsbControl +
# RTL8XXXU_USB_IDS), used by the rtl and rtw family crates.
narf-drivers-wireless-rtl-usb = { path = "rtl-usb" }
# Legacy Realtek Wi-Fi family (promoted from the former src/{rtl8xxxu,rtlwifi}/):
# rtl8xxxu USB + rtlwifi PCIe in one family crate.
narf-drivers-wireless-rtl = { path = "rtl", default-features = false, features = ["builtin"] }
async-trait = "0.1"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[features]
# Leave the built-in ath11k's PCI ids unclaimed so an early-loaded ath11k.ko
# owns the WCN6855 (the e1000/nvme precedent). AHB (IPQ/WCN6750) stays built
# in; QCA6390 and QCN9074 have no claimant in this configuration.
ath11k-module-only = []
# Leave the built-in mt76's PCI ids (MT7921/MT7922/MT7961/MT7920) unclaimed so
# an early-loaded mt76.ko owns the function. The private mt76 copy-mode family
# host stays registered.
mt76-module-only = []

# Leave the built-in ath10k's PCI ids (and its system-PM hook) unregistered
# so an early-loaded ath10k.ko owns the QCA988X/9887/6174/6164/99X0/9888/
# 9984/9377 function (the ath11k-module-only precedent).
ath10k-module-only = []

# Leave the built-in ath9k's PCI ids unclaimed so an early-loaded ath9k.ko
# owns them (the e1000/nvme/ath11k precedent). Every chip owner runs in the
# module.
ath9k-module-only = []

# Leave the built-in brcmfmac's Broadcom PCIe ids (and its PCIe system-PM
# hooks) unclaimed so an early-loaded brcm `.ko` (brcmfmac.ko) owns the
# device. CYW43439 over SDIO/gSPI stays built in.
brcmfmac-module-only = []

# Leave the built-in rtw88's RTL8821CU/RTL8822BU USB ids unclaimed so a loaded
# rtw88.ko owns those functions (USB module matches are offered only devices
# no built-in driver claimed). rtw88 PCIe and rtw89 stay built in: the .ko's
# PCIe ids are registration-only.
rtw88-module-only = []
kernel-test = ["narf-bus/kernel-test", "narf-drivers-sdio/kernel-test", "narf-wireless/kernel-test", "narf-drivers-qcom-soc/kernel-test", "narf-power/wake-test", "narf-drivers-wireless-core/kernel-test", "narf-drivers-wireless-iwlwifi/kernel-test", "narf-drivers-wireless-rtl-usb/kernel-test", "narf-drivers-wireless-rtw/kernel-test", "narf-drivers-wireless-ath-core/kernel-test", "narf-drivers-wireless-ath9k/kernel-test", "narf-drivers-wireless-ath10k/kernel-test", "narf-drivers-wireless-ath11k/kernel-test", "narf-drivers-wireless-brcm/kernel-test", "narf-drivers-wireless-rtl/kernel-test"]

[lints]
workspace = true
