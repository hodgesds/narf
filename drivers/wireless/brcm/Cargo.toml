# Broadcom / Infineon FullMAC Wi-Fi family — `brcmfmac` (PCIe) + CYW43439
# (SDIO) — dual-build.
#
# Promoted from the former `drivers/wireless/src/{brcmfmac,cyw43439}/` modules
# into one family crate: the two drivers are a deeply intertwined Broadcom
# FullMAC pair (cyw43439 reuses brcmfmac's chip/event/provision/vif/ap code and
# brcmfmac reuses cyw43439's fullmac/station/runtime), so they share a crate
# (inner module paths `brcmfmac`/`cyw43439` preserved). Built-in or a loadable
# `.ko`; the `.ko` registers BOTH buses — the CYW43439 SDIO id via
# `narf_register_sdio_driver` (the Tier-2 SDIO shim) and the brcmfmac PCIe ids
# via `narf_register_pci_driver`. Registration-only: the probe thunk returns
# -ENOSYS until the Wi-Fi device datapath ABI lands.

[package]
name         = "narf-drivers-wireless-brcm"
description  = "Broadcom/Infineon FullMAC Wi-Fi (brcmfmac PCIe + CYW43439 SDIO) — built-in or loadable module."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_wireless_brcm"
path = "src/lib.rs"

[features]
default = ["builtin"]
builtin = [
    "dep:narf-bus", "dep:narf-capabilities", "dep:narf-console",
    "dep:narf-crypto", "dep:narf-drivers", "dep:narf-drivers-sdio",
    "dep:narf-drivers-spi", "dep:narf-drivers-wireless-ath-core",
    "dep:narf-drivers-wireless-core", "dep:narf-firmware", "dep:narf-interrupts",
    "dep:narf-io", "dep:narf-ipc", "dep:narf-lib", "dep:narf-memory",
    "dep:narf-net", "dep:narf-power", "dep:narf-scheduler", "dep:narf-time",
    "dep:narf-wireless", "dep:zeroize",
]
module = []
kernel-test = [
    "builtin",
    "dep:narf-kernel-test", "dep:narf-wifi-fixtures",
    "narf-wireless/kernel-test", "narf-bus/kernel-test",
    "narf-drivers-sdio/kernel-test", "narf-power/wake-test",
    "narf-drivers-wireless-core/kernel-test",
    "narf-drivers-wireless-ath-core/kernel-test",
]

[dependencies]
narf-driver-macros = { path = "../../../driver-macros" }
async-trait        = "0.1"

narf-bus          = { path = "../../../bus", optional = true }
narf-capabilities = { path = "../../../capabilities", optional = true }
narf-console      = { path = "../../../console", optional = true }
narf-crypto       = { path = "../../../crypto", optional = true }
narf-drivers      = { path = "../..", optional = true }
narf-drivers-sdio = { path = "../../sdio", optional = true }
narf-drivers-spi  = { path = "../../spi", optional = true }
narf-drivers-wireless-ath-core = { path = "../ath-core", optional = true }
narf-drivers-wireless-core = { path = "../core", optional = true }
narf-firmware     = { path = "../../../firmware", optional = true }
narf-interrupts   = { path = "../../../interrupts", optional = true }
narf-io           = { path = "../../../io", optional = true }
narf-ipc          = { path = "../../../ipc", optional = true }
narf-lib          = { path = "../../../lib", optional = true }
narf-memory       = { path = "../../../memory", optional = true }
narf-net          = { path = "../../../net", optional = true }
narf-power        = { path = "../../../power", optional = true }
narf-scheduler    = { path = "../../../scheduler", optional = true }
narf-time         = { path = "../../../time", optional = true }
narf-wireless     = { path = "../../../wireless", optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }

# Test-only: harness + Wi-Fi fixtures.
narf-kernel-test   = { path = "../../../verification/kernel-test", optional = true }
narf-wifi-fixtures = { path = "../../../verification/wifi-fixtures", optional = true }

[lints]
workspace = true
