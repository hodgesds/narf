[package]
name         = "narf-drivers-gpu"
description  = "GPU driver skeleton — Stage-4 partial."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_gpu"
path = "src/lib.rs"

[dependencies]
narf-lib             = { path = "../../lib" }
narf-capabilities    = { path = "../../capabilities" }
narf-kernel-test     = { path = "../../verification/kernel-test" }
narf-graphics-driver = { path = "../graphics" }
narf-graphics        = { path = "../../graphics" }
narf-drivers-virtio  = { path = "../virtio" }
narf-driver-runtime  = { path = "../runtime", default-features = false, features = ["kernel"] }
narf-drivers         = { path = ".." }
narf-firmware        = { path = "../../firmware" }
narf-bus             = { path = "../../bus" }
narf-init            = { path = "../../init" }

[lints]
workspace = true
