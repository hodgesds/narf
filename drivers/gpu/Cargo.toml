[package]
name         = "narf-drivers-gpu"
description  = "GPU driver skeleton — Stage-4 partial."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_gpu"
path = "src/lib.rs"

[dependencies]
narf-lib             = { path = "../../lib" }
narf-arch            = { path = "../../arch" }
narf-capabilities    = { path = "../../capabilities" }
narf-kernel-test     = { path = "../../verification/kernel-test" }
narf-graphics-driver = { path = "../graphics" }
narf-graphics        = { path = "../../graphics" }
narf-edid            = { path = "../../edid" }
narf-drivers-virtio  = { path = "../virtio" }
narf-driver-runtime  = { path = "../runtime", default-features = false, features = ["kernel"] }
narf-drivers         = { path = ".." }
narf-drivers-usbpd   = { path = "../usbpd" }
narf-usbpd           = { path = "../../usbpd" }
narf-firmware        = { path = "../../firmware" }
narf-bus             = { path = "../../bus" }
narf-memory          = { path = "../../memory" }
narf-init            = { path = "../../init" }
narf-scheduler       = { path = "../../scheduler" }
narf-time            = { path = "../../time" }
narf-power           = { path = "../../power" }
narf-console         = { path = "../../console" }
narf-filesystem      = { path = "../../filesystem" }
narf-drivers-backlight = { path = "../backlight" }

[features]
linux-compat = ["narf-filesystem/linux-compat"]
# Tests cover linux-compat-only code (the DRM sysfs class bridge), so the
# kernel-test build must compile those paths.
kernel-test = ["linux-compat"]

[lints]
workspace = true
