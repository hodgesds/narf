[package]
name         = "narf-drivers-gpu"
description  = "GPU driver skeleton — Stage-4 partial."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_gpu"
path = "src/lib.rs"

[dependencies]
narf-lib             = { path = "../../lib" }
narf-arch            = { path = "../../arch" }
narf-capabilities    = { path = "../../capabilities" }
narf-kernel-test     = { path = "../../verification/kernel-test" }
narf-graphics-driver = { path = "../graphics" }
narf-graphics        = { path = "../../graphics" }
narf-edid            = { path = "../../edid" }
narf-drivers-virtio  = { path = "../virtio" }
narf-driver-runtime  = { path = "../runtime", default-features = false, features = ["kernel"] }
narf-drivers         = { path = ".." }
narf-drivers-usbpd   = { path = "../usbpd" }
narf-usbpd           = { path = "../../usbpd" }
narf-firmware        = { path = "../../firmware" }
narf-bus             = { path = "../../bus" }
narf-acpi            = { path = "../../acpi" }
narf-memory          = { path = "../../memory" }
narf-init            = { path = "../../init" }
narf-scheduler       = { path = "../../scheduler" }
narf-time            = { path = "../../time" }
narf-power           = { path = "../../power" }
narf-console         = { path = "../../console" }
narf-filesystem      = { path = "../../filesystem" }
narf-block           = { path = "../../block" }
narf-io              = { path = "../../io" }
narf-interrupts      = { path = "../../interrupts" }
narf-drivers-backlight = { path = "../backlight" }
narf-drivers-sound = { path = "../sound" }

[features]
# Each GPU vendor's driver set is a selectable feature. `default`
# enables them all, so the built kernel compiles the same driver
# set it did before the split. Drop one (e.g.
# `--no-default-features --features intel`) to build a kernel
# without that vendor's drivers: none of its modules compile and
# none of its PCI drivers register. The named-config registry
# (build/xtask configs) selects these per build configuration.
default = ["amdgpu", "intel"]
amdgpu = []
intel = []
# Tests cover the DRM sysfs class bridge, so the
# kernel-test build must compile those paths.
kernel-test = []

[lints]
workspace = true
