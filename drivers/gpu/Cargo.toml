[package]
name         = "narf-drivers-gpu"
description  = "GPU driver skeleton — Stage-4 partial."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_gpu"
path = "src/lib.rs"

[dependencies]
narf-lib             = { path = "../../lib", version = "0.1.0" }
narf-arch            = { path = "../../arch", version = "0.1.0" }
narf-capabilities    = { path = "../../capabilities", version = "0.1.0" }
narf-kernel-test     = { path = "../../verification/kernel-test", version = "0.1.0" }
narf-graphics-driver = { path = "../graphics", version = "0.1.0" }
narf-graphics        = { path = "../../graphics", version = "0.1.0" }
narf-edid            = { path = "../../edid", version = "0.1.0" }
narf-drivers-virtio  = { path = "../virtio", version = "0.1.0" }
narf-driver-runtime  = { path = "../runtime", version = "0.1.0", default-features = false, features = ["kernel"] }
narf-drivers         = { path = "..", version = "0.1.0" }
narf-drivers-usbpd   = { path = "../usbpd", version = "0.1.0" }
narf-usbpd           = { path = "../../usbpd", version = "0.1.0" }
narf-firmware        = { path = "../../firmware", version = "0.1.0" }
narf-bus             = { path = "../../bus", version = "0.1.0" }
narf-memory          = { path = "../../memory", version = "0.1.0" }
narf-init            = { path = "../../init", version = "0.1.0" }
narf-scheduler       = { path = "../../scheduler", version = "0.1.0" }
narf-time            = { path = "../../time", version = "0.1.0" }
narf-power           = { path = "../../power", version = "0.1.0" }
narf-console         = { path = "../../console", version = "0.1.0" }
narf-filesystem      = { path = "../../filesystem", version = "0.1.0" }
narf-drivers-backlight = { path = "../backlight", version = "0.1.0" }

[features]
linux-compat = ["narf-filesystem/linux-compat"]
# Tests cover linux-compat-only code (the DRM sysfs class bridge), so the
# kernel-test build must compile those paths.
kernel-test = ["linux-compat"]

[lints]
workspace = true
