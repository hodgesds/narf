[package]
name         = "narf-drivers-nvidia"
description  = "Full NVIDIA GPU driver — Maxwell through Ada Lovelace. Clean-room scaffold rooted at Nouveau (GPL-2.0)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_nvidia"
path = "src/lib.rs"

[features]
# Dual-build: built-in (rlib, linked into the kernel) or a loadable `.ko`.
# `default = builtin` so the built kernel is unchanged. The `module` build
# (`--no-default-features --features module`) drops every kernel crate and
# registers through the narf_register_pci_driver KSYMTAB export. See
# `narf-drivers-net-e1000`.
default = ["builtin"]
builtin = [
    "dep:narf-capabilities", "dep:narf-driver-runtime", "dep:narf-drivers",
    "dep:narf-bus", "dep:narf-memory", "dep:narf-init", "dep:narf-interrupts",
    "dep:narf-firmware", "dep:narf-crypto", "dep:narf-scheduler", "dep:narf-io",
    "dep:narf-lib",
]
module = []
# Kernel-test harness: the driver body + the test crate. Implies `builtin`.
kernel-test = ["builtin", "dep:narf-kernel-test"]

[dependencies]
narf-driver-macros   = { path = "../../../driver-macros" }
narf-capabilities    = { path = "../../../capabilities", optional = true }
narf-kernel-test     = { path = "../../../verification/kernel-test", optional = true }
narf-driver-runtime  = { path = "../../runtime", default-features = false, features = ["kernel"], optional = true }
narf-drivers         = { path = "../..", optional = true }
narf-bus             = { path = "../../../bus", optional = true }
narf-memory          = { path = "../../../memory", optional = true }
narf-init            = { path = "../../../init", optional = true }
narf-interrupts      = { path = "../../../interrupts", optional = true }
narf-firmware        = { path = "../../../firmware", optional = true }
narf-crypto          = { path = "../../../crypto", optional = true }
narf-scheduler       = { path = "../../../scheduler", optional = true }
narf-io              = { path = "../../../io", optional = true }
narf-lib             = { path = "../../../lib", optional = true }

[lints]
workspace = true
