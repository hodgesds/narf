[package]
name         = "narf-drivers-wwan"
description  = "WWAN subsystem: WwanPort registry, MBIM control plane + USB CDC-MBIM binding, raw-IP bearer netdev handoff, QMI codec, IOSM PCI device table. SIM management, RIL, and modem firmware loading are deferred; IOSM/PCIe bring-up is a follow-on."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_wwan"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-init         = { path = "../../init" }
narf-scheduler    = { path = "../../scheduler" }
narf-console      = { path = "../../console" }
narf-net          = { path = "../../net" }
narf-drivers-usb  = { path = "../usb" }

[features]
kernel-test = []

[lints]
workspace = true
