# FTDI USB-serial driver — dual-build.
#
#   * `builtin` (default): the wire codec only (`codec`). The built-in FTDI
#     binding stays in `narf-drivers-usb`'s serial cascade (shared with
#     ch341 / pl2303 / cp210x and the /dev/ttyUSB termios layer), which
#     re-exports this crate's codec so both builds program identical values.
#   * `module`: `cargo narf build build-module --package narf-drivers-usb-ftdi
#     --no-default-features --features module`. A working loadable driver:
#     it registers FT232/FT-X/FT232H matches through `narf_register_usb_driver`
#     and drives the device entirely through the `narf_usb_*` datapath
#     exports (control / bulk requests, a module-backed /dev/ttyUSB<N> node).

[package]
name         = "narf-drivers-usb-ftdi"
description  = "FTDI USB-serial driver — shared codec built in, or a working loadable module."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_usb_ftdi"
path = "src/lib.rs"

[features]
default = ["builtin"]
# The codec has no kernel dependencies, so neither build pulls any.
builtin = []
module = []

[dependencies]
narf-driver-macros = { path = "../../../driver-macros" }

[lints]
workspace = true
