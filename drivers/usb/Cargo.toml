[package]
name         = "narf-drivers-usb"
description  = "USB host controllers (xhci today; ehci/uhci/ohci later)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_usb"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-arch         = { path = "../../arch" }
narf-bus          = { path = "../../bus" }
narf-capabilities = { path = "../../capabilities" }
narf-io           = { path = "../../io" }
narf-memory       = { path = "../../memory" }
narf-drivers      = { path = "../" }
narf-init         = { path = "../../init" }
narf-input        = { path = "../../input" }
narf-interrupts   = { path = "../../interrupts" }
narf-acpi         = { path = "../../acpi" }
narf-aml          = { path = "../../aml" }
narf-console      = { path = "../../console" }
narf-scheduler    = { path = "../../scheduler" }
narf-time         = { path = "../../time" }
narf-kernel-test  = { path = "../../verification/kernel-test" }

[features]
kernel-test = []

[lints]
workspace = true
