[package]
name         = "narf-drivers-usb"
description  = "USB host controllers (xhci today; ehci/uhci/ohci later)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_usb"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-arch         = { path = "../../arch" }
narf-bus          = { path = "../../bus" }
narf-capabilities = { path = "../../capabilities" }
narf-io           = { path = "../../io" }
narf-memory       = { path = "../../memory" }
narf-drivers      = { path = "../" }
narf-init         = { path = "../../init" }
narf-input        = { path = "../../input" }
narf-input-driver = { path = "../input" }
narf-hid          = { path = "../../hid" }
narf-interrupts   = { path = "../../interrupts" }
narf-acpi         = { path = "../../acpi" }
narf-aml          = { path = "../../aml" }
narf-console      = { path = "../../console" }
narf-scheduler    = { path = "../../scheduler" }
narf-time         = { path = "../../time" }
async-trait       = "0.1"
narf-block        = { path = "../../block" }
narf-net          = { path = "../../net" }
narf-firmware     = { path = "../../firmware" }
narf-drivers-video = { path = "../video" }
narf-drivers-fingerprint = { path = "../fingerprint" }
narf-drivers-sound = { path = "../sound" }
narf-drivers-leds = { path = "../leds" }
narf-power        = { path = "../../power" }
narf-filesystem   = { path = "../../filesystem" }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-ctap2        = { path = "../../ctap2" }
narf-crypto       = { path = "../../crypto" }
narf-drivers-usb-ftdi = { path = "ftdi" }
narf-drivers-usb-storage = { path = "storage" }

[features]
kernel-test = ["narf-ctap2/kernel-test"]
# Leave FTDI parts to a loadable `ftdi_sio` module (`narf-drivers-usb-ftdi`,
# `--features module`): the built-in serial cascade skips the FTDI family, so
# the device falls through to the module's `narf_register_usb_driver` match.
# Used by `cargo narf ftdi-module-serial-smoke`; off in every normal build.
ftdi-module-only = []
# Leave USB mass storage (BOT, 08/06/50) to `usb-storage.ko`: the built-in
# binder skips it and does not register its class entry, so the stick falls
# through to module matches. Used by `cargo narf usb-storage-module-block-smoke`.
msc-module-only = []
# Bind USB CCID smart-card readers in the kernel and publish /dev/ccid<N>.
# Off by default: as on Linux, pcscd drives readers itself through usbfs,
# which needs the interface unclaimed.
usb-ccid = []

[lints]
workspace = true
