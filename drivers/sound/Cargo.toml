[package]
name         = "narf-drivers-sound"
description  = "Intel/AMD HDA controller + Realtek codec drivers + ALSA-equivalent PCM/mixer surface. Targets the AMD HDA controllers on Zen2/Phoenix laptops with Realtek ALC codecs."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_sound"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib", version = "0.1.0" }
narf-capabilities = { path = "../../capabilities", version = "0.1.0" }
narf-memory       = { path = "../../memory", version = "0.1.0" }
narf-io           = { path = "../../io", version = "0.1.0" }
narf-arch         = { path = "../../arch", version = "0.1.0" }
narf-bus          = { path = "../../bus", version = "0.1.0" }
narf-interrupts   = { path = "../../interrupts", version = "0.1.0" }
narf-init         = { path = "../../init", version = "0.1.0" }
narf-scheduler    = { path = "../../scheduler", version = "0.1.0" }
narf-time         = { path = "../../time", version = "0.1.0" }
narf-drivers      = { path = "../../drivers", version = "0.1.0" }
narf-filesystem   = { path = "../../filesystem", version = "0.1.0" }
narf-kernel-test  = { path = "../../verification/kernel-test", version = "0.1.0" }

[features]
linux-compat = ["narf-filesystem/linux-compat"]
kernel-test = []

[lints]
workspace = true
