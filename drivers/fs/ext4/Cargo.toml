[package]
name         = "narf-drivers-fs-ext4"
description  = "ext4 filesystem driver (extent trees + JBD2 journal). Specialised companion to drivers/fs/ext2."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_fs_ext4"
path = "src/lib.rs"

# ext4 is the ext-family's flagship layout (extent trees, JBD2 journal,
# 64-bit, FLEX_BG). The on-disk types live in `drivers/fs/ext2/` —
# that crate already carries ext4-aware decoders because it was
# written to grow ext2 → ext3 → ext4 along the feature-flag axis. This
# crate re-exports those types behind ext4-flavour names and layers
# the ext4-specific contract (must have EXTENTS, must validate
# extent-tree on every inode) on top.
[dependencies]
narf-lib              = { path = "../../../lib", version = "0.1.0" }
narf-arch             = { path = "../../../arch", version = "0.1.0" }
narf-drivers          = { path = "../../", version = "0.1.0" }
narf-driver-runtime   = { path = "../../runtime", version = "0.1.0" }
narf-capabilities     = { path = "../../../capabilities", version = "0.1.0" }
narf-memory           = { path = "../../../memory", version = "0.1.0" }
narf-block            = { path = "../../../block", version = "0.1.0" }
narf-filesystem       = { path = "../../../filesystem", version = "0.1.0" }
narf-io               = { path = "../../../io", version = "0.1.0" }
narf-init             = { path = "../../../init", version = "0.1.0" }
narf-scheduler        = { path = "../../../scheduler", version = "0.1.0" }
narf-time             = { path = "../../../time", version = "0.1.0" }
narf-drivers-fs-ext2  = { path = "../ext2", version = "0.1.0" }
narf-kernel-test      = { path = "../../../verification/kernel-test", version = "0.1.0" }

[lints]
workspace = true
