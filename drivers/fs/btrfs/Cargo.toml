[package]
name = "narf-drivers-fs-btrfs"
description = "Single-device read-write btrfs filesystem driver with COW and snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "narf_drivers_fs_btrfs"
path = "src/lib.rs"

[dependencies]
blake2 = { version = "0.10", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
ruzstd = { version = "0.8", default-features = false }
sha2 = { version = "0.10", default-features = false }
narf-block = { path = "../../../block", version = "0.1.0" }
narf-capabilities = { path = "../../../capabilities", version = "0.1.0" }
narf-driver-runtime = { path = "../../runtime", version = "0.1.0" }
narf-filesystem = { path = "../../../filesystem", version = "0.1.0" }
narf-init = { path = "../../../init", version = "0.1.0" }
narf-io = { path = "../../../io", version = "0.1.0" }
narf-kernel-test = { path = "../../../verification/kernel-test", version = "0.1.0", optional = true }
narf-lib = { path = "../../../lib", version = "0.1.0" }
narf-memory = { path = "../../../memory", version = "0.1.0" }
narf-scheduler = { path = "../../../scheduler", version = "0.1.0" }

[features]
kernel-test = ["dep:narf-kernel-test"]

[lints]
workspace = true
