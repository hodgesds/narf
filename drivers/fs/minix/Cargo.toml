description  = "Clean room MINIX (V1/V2/V3) filesystem driver. Read-only first cut."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_fs_minix"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../../lib", version = "0.1.0" }
