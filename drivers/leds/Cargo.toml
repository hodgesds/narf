[package]
name         = "narf-drivers-leds"
description  = "LED class registry + GPIO/PWM/HID-keyboard LED drivers."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_leds"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib", version = "0.1.0" }
narf-drivers-gpio = { path = "../gpio", version = "0.1.0" }
narf-pwm          = { path = "../../pwm", version = "0.1.0" }
narf-kernel-test  = { path = "../../verification/kernel-test", version = "0.1.0" }
narf-init         = { path = "../../init", version = "0.1.0" }
narf-scheduler    = { path = "../../scheduler", version = "0.1.0" }
narf-time         = { path = "../../time", version = "0.1.0" }
narf-filesystem   = { path = "../../filesystem", version = "0.1.0" }
async-trait       = "0.1"

[features]
linux-compat = ["narf-filesystem/linux-compat"]
kernel-test = []

[lints]
workspace = true
