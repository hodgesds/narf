[package]
name         = "narf-drivers-platform"
description  = "Platform / chipset peripheral drivers (SMBus, TPM 2.0, ...). Public-spec clean-room implementations."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_platform"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-bus          = { path = "../../bus" }
narf-capabilities = { path = "../../capabilities" }
narf-io           = { path = "../../io" }
narf-memory       = { path = "../../memory" }
narf-drivers      = { path = "../" }
narf-init         = { path = "../../init" }
narf-tpm          = { path = "../../tpm" }
narf-drivers-tpm  = { path = "../tpm" }
narf-filesystem   = { path = "../../filesystem" }
narf-arch         = { path = "../../arch" }
narf-acpi         = { path = "../../acpi" }
narf-aml          = { path = "../../aml" }
narf-power        = { path = "../../power" }
narf-pwm          = { path = "../../pwm" }
narf-interrupts   = { path = "../../interrupts" }
narf-input        = { path = "../../input" }
narf-console      = { path = "../../console" }
narf-scheduler    = { path = "../../scheduler" }
narf-time         = { path = "../../time" }
narf-kernel-test     = { path = "../../verification/kernel-test" }
narf-firmware-smbios = { path = "../../firmware/smbios" }
# Used only by the TPM device model (tpm_fixture): the model's AK
# derivation and Quote signing need real P-256 math, and a third
# hand-copied ECC implementation in fixture code is exactly the
# transcription risk the model's copied SHA-256 (100 lines, FIPS-
# pinned) does not pose at ECC's size. Production code in this
# crate does not import narf-crypto. `ecdsa-sign` enables the
# RFC 6979 deterministic signer (the verifier side is ungated).
narf-crypto       = { path = "../../crypto", features = ["ecdsa-sign"] }
async-trait       = "0.1"

[features]
kernel-test = []

[lints]
workspace = true
