[package]
name         = "narf-drivers-qcom-soc"
description  = "Qualcomm SoC platform layer: DT platform devices, SCM (SMCCC) PAS calls, MDT/MBN loader, SMEM, SMP2P, GCC resets/branch clocks, Q6 WCSS and PAS remoteprocs."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_qcom_soc"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../../lib" }
narf-arch         = { path = "../../../arch" }
narf-memory       = { path = "../../../memory" }
narf-io           = { path = "../../../io" }
narf-time         = { path = "../../../time" }
narf-interrupts   = { path = "../../../interrupts" }
narf-firmware-fdt = { path = "../../../firmware/fdt" }
narf-kernel-test  = { path = "../../../verification/kernel-test" }

[features]
kernel-test = []

[lints]
workspace = true
