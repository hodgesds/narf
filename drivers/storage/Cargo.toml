[package]
name         = "narf-drivers-storage"
description  = "Non-NVMe storage drivers (AHCI today; virtio-scsi later)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_storage"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib", version = "0.1.0" }
narf-bus          = { path = "../../bus", version = "0.1.0" }
narf-capabilities = { path = "../../capabilities", version = "0.1.0" }
narf-console      = { path = "../../console", version = "0.1.0" }
narf-io           = { path = "../../io", version = "0.1.0" }
narf-memory       = { path = "../../memory", version = "0.1.0" }
narf-time         = { path = "../../time", version = "0.1.0" }
narf-block        = { path = "../../block", version = "0.1.0" }
narf-filesystem   = { path = "../../filesystem", version = "0.1.0" }
narf-drivers      = { path = "../", version = "0.1.0" }
narf-init         = { path = "../../init", version = "0.1.0" }
narf-interrupts   = { path = "../../interrupts", version = "0.1.0" }
narf-scheduler    = { path = "../../scheduler", version = "0.1.0" }
narf-acpi         = { path = "../../acpi", version = "0.1.0" }
narf-aml          = { path = "../../aml", version = "0.1.0" }
narf-kernel-test  = { path = "../../verification/kernel-test", version = "0.1.0" }

[features]
# Declared so `#[cfg(feature = "kernel-test")]` in src/ doesn't
# trip the unexpected_cfgs lint. Empty body — gating is purely
# at the source level; the kernel-test harness pulls these
# crates through whether the feature is on or not.
kernel-test = []

[lints]
workspace = true
