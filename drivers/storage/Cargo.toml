[package]
name         = "narf-drivers-storage"
description  = "Non-NVMe storage drivers (AHCI today; virtio-scsi later)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_storage"
path = "src/lib.rs"

[dependencies]
narf-driver-macros = { path = "../../driver-macros" }
narf-drivers-storage-core = { path = "core" }
narf-drivers-storage-ahci     = { path = "ahci", optional = true }
narf-drivers-storage-megaraid = { path = "megaraid", optional = true }
narf-drivers-storage-mpt3sas  = { path = "mpt3sas", optional = true }
narf-drivers-storage-rtsx     = { path = "rtsx", optional = true }
narf-drivers-storage-sdhci    = { path = "sdhci", optional = true }
narf-drivers-storage-smartpqi = { path = "smartpqi", optional = true }
narf-drivers-storage-vmd      = { path = "vmd", optional = true }
narf-lib          = { path = "../../lib" }
narf-bus          = { path = "../../bus" }
narf-capabilities = { path = "../../capabilities" }
narf-console      = { path = "../../console" }
narf-io           = { path = "../../io" }
narf-memory       = { path = "../../memory" }
narf-time         = { path = "../../time" }
narf-block        = { path = "../../block" }
narf-filesystem   = { path = "../../filesystem" }
narf-drivers      = { path = "../" }
narf-init         = { path = "../../init" }
narf-interrupts   = { path = "../../interrupts" }
narf-scheduler    = { path = "../../scheduler" }
narf-acpi         = { path = "../../acpi" }
narf-aml          = { path = "../../aml" }
narf-kernel-test  = { path = "../../verification/kernel-test" }

[features]
# Each storage controller is a selectable dual-build crate. `default` enables
# them all, so the built kernel compiles the same set as before the split.
default = ["ahci", "megaraid", "mpt3sas", "rtsx", "sdhci", "smartpqi", "vmd"]
# Declared so frame's `narf-drivers-storage/kernel-test` dep resolves; the only
# source-level consumer is rtsx's block_bridge, so propagate there.
kernel-test = ["narf-drivers-storage-rtsx?/kernel-test"]
ahci = ["dep:narf-drivers-storage-ahci"]
megaraid = ["dep:narf-drivers-storage-megaraid"]
mpt3sas = ["dep:narf-drivers-storage-mpt3sas"]
rtsx = ["dep:narf-drivers-storage-rtsx"]
sdhci = ["dep:narf-drivers-storage-sdhci"]
smartpqi = ["dep:narf-drivers-storage-smartpqi"]
vmd = ["dep:narf-drivers-storage-vmd"]


[lints]
workspace = true
