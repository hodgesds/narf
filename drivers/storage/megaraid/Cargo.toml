# megaraid — LSI MegaRAID SAS controller, dual-build (built-in or loadable .ko). See narf-drivers-net-e1000.
[package]
name         = "narf-drivers-storage-megaraid"
description  = "LSI MegaRAID SAS controller — built-in or loadable module."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
[lib]
name = "narf_drivers_storage_megaraid"
path = "src/lib.rs"
[features]
default = ["builtin"]
builtin = [
    "dep:narf-drivers-storage-core", "dep:narf-acpi", "dep:narf-aml",
    "dep:narf-block", "dep:narf-bus", "dep:narf-capabilities",
    "dep:narf-console", "dep:narf-drivers", "dep:narf-filesystem",
    "dep:narf-interrupts", "dep:narf-io", "dep:narf-kernel-test",
    "dep:narf-lib", "dep:narf-memory", "dep:narf-scheduler", "dep:narf-time",
]
module = []
[dependencies]
narf-driver-macros = { path = "../../../driver-macros" }
narf-drivers-storage-core = { path = "../core", optional = true }
narf-acpi         = { path = "../../../acpi", optional = true }
narf-aml          = { path = "../../../aml", optional = true }
narf-block        = { path = "../../../block", optional = true }
narf-bus          = { path = "../../../bus", optional = true }
narf-capabilities = { path = "../../../capabilities", optional = true }
narf-console      = { path = "../../../console", optional = true }
narf-drivers      = { path = "../..", optional = true }
narf-filesystem   = { path = "../../../filesystem", optional = true }
narf-interrupts   = { path = "../../../interrupts", optional = true }
narf-io           = { path = "../../../io", optional = true }
narf-kernel-test  = { path = "../../../verification/kernel-test", optional = true }
narf-lib          = { path = "../../../lib", optional = true }
narf-memory       = { path = "../../../memory", optional = true }
narf-scheduler    = { path = "../../../scheduler", optional = true }
narf-time         = { path = "../../../time", optional = true }
[lints]
workspace = true
