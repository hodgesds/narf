[package]
name         = "narf-drivers-video"
description  = "Camera ISP driver scaffold — Intel IPU3/IPU6 + AMD MP2 ISP (Stage-0/1)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_video"
path = "src/lib.rs"

[dependencies]
narf-lib             = { path = "../../lib" }
narf-capabilities    = { path = "../../capabilities" }
narf-kernel-test     = { path = "../../verification/kernel-test" }
narf-driver-runtime  = { path = "../runtime", default-features = false, features = ["kernel"] }
narf-drivers         = { path = ".." }
narf-bus             = { path = "../../bus" }
narf-init            = { path = "../../init" }
narf-filesystem      = { path = "../../filesystem" }
narf-drivers-i2c     = { path = "../i2c" }
narf-console         = { path = "../../console" }
narf-scheduler       = { path = "../../scheduler" }

[features]
# The sysfs `/sys/class/video4linux/video<N>/` registration is gated
# behind `linux-compat`; the kernel-test smokes assert that registration
# against a synthetic device, so the test build must compile it in.
kernel-test = ["linux-compat"]
# `register_sysfs` calls into `narf_filesystem::sysfs`, which is itself
# gated behind narf-filesystem's `linux-compat`; forward it so this
# crate's linux-compat surface is self-consistent (builds standalone).
linux-compat = ["narf-filesystem/linux-compat"]

[lints]
workspace = true
