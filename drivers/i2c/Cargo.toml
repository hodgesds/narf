[package]
name         = "narf-drivers-i2c"
description  = "I2C bus trait + AMD FCH (Designware-derived) controller driver."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_drivers_i2c"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib" }
narf-memory       = { path = "../../memory" }
narf-arch         = { path = "../../arch" }
narf-aml          = { path = "../../aml" }
narf-acpi         = { path = "../../acpi" }
narf-init         = { path = "../../init" }
narf-console      = { path = "../../console" }
narf-interrupts   = { path = "../../interrupts" }
narf-scheduler    = { path = "../../scheduler" }
narf-kernel-test  = { path = "../../verification/kernel-test" }
narf-bus          = { path = "../../bus" }
narf-capabilities = { path = "../../capabilities" }
async-trait       = "0.1"

[features]
kernel-test = []

[lints]
workspace = true
