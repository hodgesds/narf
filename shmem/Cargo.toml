[package]
name         = "narf-shmem"
description  = "Userspace-mappable shared-memory handles. One handle = one pid-owned, kernel-coherent region; mappable into the owning process's VA, attachable to FB / audio / future driver-side consumers; reaped on process exit."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_shmem"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib", version = "0.1.0" }
narf-capabilities = { path = "../capabilities", version = "0.1.0" }
narf-init         = { path = "../init", version = "0.1.0" }
narf-memory       = { path = "../memory", version = "0.1.0" }
narf-userspace    = { path = "../userspace", version = "0.1.0" }
narf-io           = { path = "../io", version = "0.1.0" }
narf-kernel-test  = { path = "../verification/kernel-test", version = "0.1.0" }

[lints]
workspace = true
