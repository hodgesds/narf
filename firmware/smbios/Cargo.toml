[package]
name         = "narf-firmware-smbios"
description  = "SMBIOS / DMI table parser. Locates the entry point, walks fixed-size structures, decodes BIOS / System / Baseboard / Processor / Memory-Device records. Spec: firmware/smbios/specification/spec.md."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_firmware_smbios"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../../lib", version = "0.1.0" }
narf-memory       = { path = "../../memory", version = "0.1.0" }
narf-kernel-test  = { path = "../../verification/kernel-test", version = "0.1.0" }

[lints]
workspace = true
