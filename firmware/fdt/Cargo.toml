[package]
name         = "narf-firmware-fdt"
description  = "Flattened Device Tree (FDT / DTB v17) parser. Header validate, struct-block walker, property + node + reg + interrupts decoders. Spec: firmware/fdt/specification/spec.md."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_firmware_fdt"
path = "src/lib.rs"

[dependencies]
narf-lib         = { path = "../../lib" }
narf-kernel-test = { path = "../../verification/kernel-test" }

[lints]
workspace = true
