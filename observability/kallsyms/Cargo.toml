[package]
name         = "narf-kallsyms"
description  = "Compact kernel symbol table format: build-time encoder and allocation-free decoder for /proc/kallsyms."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_kallsyms"
path = "src/lib.rs"

[features]
# The encoder (`encode` module). Host-only: `build/xtask` enables it to write
# the table after linking; the kernel only ever decodes.
alloc = []

[lints]
workspace = true
