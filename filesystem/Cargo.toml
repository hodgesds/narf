[package]
name         = "narf-filesystem"
description  = "VFS core, path resolution, mount tree, initramfs, virtiofs skeleton. Stage-3 subset."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_filesystem"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib", version = "0.1.0" }
narf-arch         = { path = "../arch", version = "0.1.0" }
narf-boot         = { path = "../boot", version = "0.1.0" }
narf-memory       = { path = "../memory", version = "0.1.0" }
narf-init         = { path = "../init", version = "0.1.0" }
narf-capabilities = { path = "../capabilities", version = "0.1.0" }
narf-block        = { path = "../block", version = "0.1.0" }
narf-io           = { path = "../io", version = "0.1.0" }
narf-scheduler    = { path = "../scheduler", version = "0.1.0" }
narf-time         = { path = "../time", version = "0.1.0" }
narf-input        = { path = "../input", version = "0.1.0" }
narf-bus          = { path = "../bus", version = "0.1.0" }
narf-console      = { path = "../console", version = "0.1.0" }
narf-interrupts   = { path = "../interrupts", version = "0.1.0" }
narf-kernel-test  = { path = "../verification/kernel-test", version = "0.1.0" }
narf-efi          = { path = "../efi", version = "0.1.0" }

[features]
# Linux-shaped mount/bind-mount/overlayfs plumbing.  Stub for Waves 63-67.
linux-compat = []

# Namespace-aware filesystem and procfs behavior. Enabled transitively by
# narf-userspace/container so procfs never advertises disabled namespace
# limits while the syscall layer has namespaces enabled.
container = []

# cgroup-v2 unified hierarchy (`cgroupfs`, mounted at /sys/fs/cgroup).
# Base feature: organizational tree + process-membership tracking +
# freeze/kill/events. Resource controllers are additive sub-features
# below, each implying `cgroup`. `cgroup-all` turns on everything.
# Orthogonal to linux-compat and container.
cgroup = []

# Resource controllers (each implies the base `cgroup`).
cgroup-pids   = ["cgroup"]
cgroup-misc   = ["cgroup"]
cgroup-memory = ["cgroup", "narf-memory/cgroup", "narf-scheduler/cgroup"]
cgroup-cpu    = ["cgroup", "narf-scheduler/cgroup"]
cgroup-cpuset = ["cgroup", "narf-scheduler/cgroup"]
cgroup-io     = ["cgroup", "narf-block/cgroup"]
cgroup-psi    = ["cgroup"]

# Everything.
cgroup-all = [
    "cgroup-pids",
    "cgroup-misc",
    "cgroup-memory",
    "cgroup-cpu",
    "cgroup-cpuset",
    "cgroup-io",
    "cgroup-psi",
]

[lints]
workspace = true
