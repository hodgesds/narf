[package]
name         = "narf-filesystem"
description  = "VFS core, path resolution, mount tree, initramfs, virtiofs skeleton. Stage-3 subset."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_filesystem"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-arch         = { path = "../arch" }
narf-boot         = { path = "../boot" }
narf-memory       = { path = "../memory" }
narf-init         = { path = "../init" }
narf-capabilities = { path = "../capabilities" }
narf-block        = { path = "../block" }
narf-io           = { path = "../io" }
narf-scheduler    = { path = "../scheduler" }
narf-time         = { path = "../time" }
narf-input        = { path = "../input" }
narf-bus          = { path = "../bus" }
narf-console      = { path = "../console" }
narf-interrupts   = { path = "../interrupts" }
narf-kernel-test  = { path = "../verification/kernel-test" }

[features]
# Linux-shaped mount/bind-mount/overlayfs plumbing.  Stub for Waves 63-67.
linux-compat = []

# Per-namespace mount trees.  Orthogonal to linux-compat.
# Stub for Waves 63-67.
container = []

# cgroup-v2 unified hierarchy (`cgroupfs`, mounted at /sys/fs/cgroup).
# Provides the organizational tree + process-membership tracking that
# an init system (systemd) needs to reach PID 1, with an *empty*
# controller set — no resource accounting/enforcement. Resource
# controllers land later as additive sub-features (cgroup-pids,
# cgroup-memory, cgroup-cpu). Orthogonal to linux-compat and
# container.
cgroup = []

[lints]
workspace = true
