[features]
# Profiling: emit a `perf stat`-style line (per-CPU narf_lib::perf software
# counters + hardware PMU) every ~3000 timer ticks. Counters are always on;
# this just enables the periodic serial dump. Off by default.
perf-dump = []
# stall-watchdog: arm the scheduler-stall watchdog. It emits a detailed
# per-CPU/task dump and then panics when forward progress remains stalled.
# Detects a global forward-progress stall (the intermittent SMP wedge) and
# dumps per-CPU scheduler state once for classification. Off by default.
stall-watchdog = []

# Linux-shaped syscall surface: epoll, eventfd, timerfd, clone3,
# mprotect, madvise, and dynamic-linker plumbing.  Forwarded from
# narf-userspace.  Also forwarded to narf-drivers-gpu so the DRM sysfs
# class (/sys/class/drm/card<N>) is populated — without it libudev finds
# no GPU and weston's drm-backend fails with "no drm device found".
syscall-trace = ["narf-userspace/syscall-trace"]
unix-latency-trace = ["narf-userspace/unix-latency-trace"]

# Frame-scrub-on-free debug/hardening aids, forwarded to narf-memory.
# Off by default; each adds a 4 KiB write to the genuine-free path.
#   frame-zero-on-free   — zero freed frames (info-leak hardening).
#   frame-poison-on-free — fill freed frames with 0xDEAD_BEEF_DEAD_BEEF
#                          so a use-after-free / stale-frame pointer read
#                          faults on a diagnostic value (turns the
#                          "marginal-buddy" execve #PF into an obvious
#                          deadbeef signature). Wins over zero if both.
frame-zero-on-free   = ["narf-memory/frame-zero-on-free"]
frame-poison-on-free = ["narf-memory/frame-poison-on-free"]
# Per-frame double-alloc/double-free audit (panics at the bad caller).
frame-alloc-audit    = ["narf-memory/frame-alloc-audit"]
# Slab free-site audit: on the free-block canary trip, print the freed
# 16-byte block's captured {data, vtable} words so `addr2line` of the
# vtable names the concrete type (the rip=0x3 vtable-UAF hunt).
slab-free-audit      = ["narf-memory/slab-free-audit"]

# Kernel Address Sanitizer write-catch (freed-slab write-after-free hunt).
# Forwarded to narf-memory; the build must ALSO pass
# `-Zsanitizer=kernel-address` (use `cargo xtask <cmd> --kasan`).
kasan                = ["narf-memory/kasan"]

# Namespace isolation.  Forwarded from narf-userspace.  Stub for Waves 63-67.
container = ["narf-userspace/container"]

# QEMU user-mode (SLIRP) static network config: assign the virtio-net
# iface the well-known SLIRP guest lease (10.0.2.15/24, gw 10.0.2.2) at
# boot so a guest server is reachable from the host via `hostfwd`. Opt-in
# (dev / CI off-box network smoke); real hardware should run DHCP.
qemu-net = []

# mt-echo benchmark workload: at boot, spawn the multithreaded
# SO_REUSEPORT echo server (one Listen TCB per worker thread) instead of
# redis, so a multi-queue/RSS NIC can be driven in parallel across cores.
# Implies qemu-net (needs the off-box vnet0 config). Thread count comes
# from the kernel cmdline `mt_echo_threads=N` (default = CPU count).
mt-echo = ["qemu-net"]

# cgroup-v2 unified hierarchy. Forwarded from narf-userspace; the
# boot path also places init/shell into the root cgroup. Mounts
# cgroupfs at /sys/fs/cgroup.
#
# Base feature = organizational tree + freeze/kill/events. Resource
# controllers are additive sub-features that pass through to
# narf-filesystem (which owns the cgroupfs tree and the controller
# implementations); `cgroup-all` turns on everything. A kernel image
# only enforces a controller it was built with — `memory.max`
# enforcement, for instance, requires `cgroup-memory`.
# Forwards to `narf-scheduler/cgroup` as well, which is not optional: this
# crate's `cross_crate_init::install_all_hooks` calls
# `narf_scheduler::install_memory_pid_resolver` / `install_process_task_resolver`
# under `#[cfg(feature = "cgroup")]`, and those items are themselves behind
# scheduler's `cgroup`. Without the forward, `--features container,cgroup`
# compiled the calls without the callees and failed to build; the combination
# only worked via `cgroup-all`, which reaches scheduler through
# `narf-filesystem/cgroup-memory`. CI never caught it because
# `run_ci_locally.sh`'s feature checks only exercise `narf-userspace`, never
# this crate.
cgroup = ["narf-userspace/cgroup", "narf-filesystem/cgroup", "narf-scheduler/cgroup"]

cgroup-pids   = ["cgroup", "narf-filesystem/cgroup-pids"]
cgroup-misc   = ["cgroup", "narf-filesystem/cgroup-misc"]
cgroup-memory = ["cgroup", "narf-filesystem/cgroup-memory"]
cgroup-cpu    = ["cgroup", "narf-filesystem/cgroup-cpu"]
cgroup-cpuset = ["cgroup", "narf-filesystem/cgroup-cpuset"]
cgroup-io     = ["cgroup", "narf-filesystem/cgroup-io"]
cgroup-psi    = ["cgroup", "narf-filesystem/cgroup-psi"]

cgroup-all = [
    "cgroup-pids",
    "cgroup-misc",
    "cgroup-memory",
    "cgroup-cpu",
    "cgroup-cpuset",
    "cgroup-io",
    "cgroup-psi",
]

# Default feature set. `user-task-smp` is on by default. It gates ONLY the
# user-task-specific per-AP behaviour: runtime cross-CPU migration
# (`enable_user_task_smp`) and the syscall-body IRQ window (`sti`/`cli`).
# The per-CPU AP HARDWARE setup — per-CPU GDT/TSS/rsp0/IST, GS.base,
# EFER.NXE, CR4/SSE/XSAVE parity, and 64 KiB AP stacks — is UNCONDITIONAL:
# required for any AP to take traps/IRQs/IPIs correctly regardless of whether
# user tasks run there (sharing the BSP's TSS/IST corrupts memory — that was
# a long-lived heisenbug). `--no-default-features` pins user tasks to the
# BSP; the per-CPU AP setup stays on either way.
default = ["user-task-smp"]

# User-task SMP: let USER tasks migrate onto application processors.
# ON by default. Provides the per-AP user-mode machinery (per-CPU
# GDT/TSS/SYSCALL, EFER.NXE + CR4 SMEP/SMAP/OSFXSR parity, larger AP
# stacks) and enables `enable_user_task_smp` at boot when x2APIC is
# active (otherwise it self-disables and user tasks stay BOOT-pinned).
# The cross-CPU TLB-shootdown ack-wait services peers while spinning and
# work-stealing uses try_lock, so a migrated task's mprotect-heavy
# dynamic-linker shootdowns no longer deadlock against IRQ-masked peers.
# Full musl-demo (82/82) + boot-smoke soak clean under migration.
user-task-smp = []

# Self-test: trigger a #UD at end-of-boot to prove the IDT dispatches.
# Off by default; enable with `cargo xtask run --arch=x86_64 --features idt-selftest`.
idt-selftest = []
# Full-boot smoke: exercise the real init flow (not the kernel-test
# harness), then ACPI-shutdown cleanly via `narf_arch::exit_kernel(0)`
# at a "boot ready" milestone. Lets `cargo xtask boot-smoke` watch for
# panic markers + a natural QEMU exit instead of having to kill the
# child after a wall-clock timeout. Mutually exclusive with
# `kernel-test` (kernel-test takes the test harness path; boot-smoke
# takes the real init path).
boot-smoke = []
# Forward narf-firmware's `firmware-allow-unsigned` so bring-up
# initramfs blobs packed with `xtask pack-firmware` (all-zero
# signature sentinel) actually load. Production builds disable
# this and require keyed signatures.
firmware-allow-unsigned = [
    "narf-firmware/firmware-allow-unsigned",
    "narf-verification?/firmware-allow-unsigned",
]
# Run the narf-verification kernel-test harness instead of the async demo.
# Used by `cargo xtask test` — exits 0 if all tests pass, non-zero otherwise.
kernel-test  = [
    "dep:narf-verification",
    "narf-memory/kernel-test",
    "narf-audio/kernel-test",
    "narf-bluetooth/kernel-test",
    "narf-edid/kernel-test",
    "narf-efi/kernel-test",
    "narf-boot/kernel-test",
    "narf-hid/kernel-test",
    "narf-pinctrl/kernel-test",
    "narf-usbpd/kernel-test",
    "narf-drivers-usb/kernel-test",
    "narf-drivers-storage/kernel-test",
    "narf-drivers-video/kernel-test",
    "narf-drivers-usbpd/kernel-test",
    "narf-drivers-gpu/kernel-test",
    "narf-drivers-nvidia/kernel-test",
    "narf-drivers-fingerprint/kernel-test",
    "narf-wireless/kernel-test",
    "narf-drivers-wireless/kernel-test",
    "narf-accel/kernel-test",
    "narf-tpm/kernel-test",
    "narf-i3c/kernel-test",
    "narf-drivers-i3c/kernel-test",
    "narf-drivers-i2c/kernel-test",
    "narf-drivers-gpio/kernel-test",
    "narf-pwm/kernel-test",
    "narf-drivers-leds/kernel-test",
    "narf-drivers-backlight/kernel-test",
    "narf-drivers-fs-btrfs/kernel-test",
    "narf-pmbus/kernel-test",
    "narf-spdm/kernel-test",
    "narf-scmi/kernel-test",
    "narf-fb/kernel-test",
    "narf-arch/kernel-test",
    "narf-scheduler/kernel-test",
    "narf-userspace/kernel-test",
    "bpf",
]
# In-kernel BPF smokes (`cargo xtask test --subsystem bpf`).
#
# The BPF *subsystem* is unconditional: `bpf(2)` is registered on every build
# (cap-gated, so an unprivileged caller gains nothing) and
# `narf_bpf::register_initcalls()` runs at boot. Gating the syscall behind a
# feature would only add another feature-combination to check while changing
# nothing an attacker sees. This feature turns on the smokes. It also pulls in
# the BPF idle governor (a struct_ops consumer) and its `bpf/idle` +
# `bpf/structops` smokes, so the struct_ops seam is exercised end to end.
bpf = [
    "narf-bpf/kernel-test",
    "bpf-idle",
    "narf-bpf-idle/kernel-test",
    "bpf-leds",
    "narf-bpf-leds/kernel-test",
]

# The BPF idle governor: a struct_ops consumer that lets a runtime-supplied BPF
# program drive `narf-power`'s C-state selector. Off by default during bring-up
# (the confinement layer in specification/domain-confinement.md is not built
# yet); enable to compile the consumer into the image.
bpf-idle = ["dep:narf-bpf-idle"]

# The BPF LED control kfunc (`narf_led_submit`): lets a program set an LED's
# brightness, blink it, or set an RGB color, mediated through the LED engine
# worker. Off by default; enable to compile the kfunc + start the worker.
bpf-leds = ["dep:narf-bpf-leds"]

# Chain into verification's opt-in user-mode smoke tests (round-trip,
# yield_resume, poll_yield_exit, future yield_exit). These pass the
# kernel through to subsequent tests without exiting.
user-mode-e2e = ["kernel-test", "narf-verification/user-mode-e2e"]
# Chain into verification's full testbin runner (implies user-mode-e2e).
# Enables the `narf-testbin` ELF build and the runner test, which calls
# `exit_kernel(0)` on success and therefore must run last.
user-mode-testbin = ["user-mode-e2e", "narf-verification/user-mode-testbin"]
# Chain into verification's narf-libc validate-binary runner.
# Builds the libc shim + the validate sub-crate's ELF and runs it
# end-to-end through the user-mode pipeline. Like user-mode-testbin,
# this calls `exit_kernel(0)` on success and must run last.
narf-libc-validate = ["user-mode-e2e", "narf-verification/narf-libc-validate"]
# Build init+shell ELFs and load + spawn `init` from the production
# `run_async_demo` boot path. On by default (see `default` above);
# strip with `--no-default-features` for a minimal kernel.
# A real boot brings up the full Linux-shaped syscall surface, including
# the per-pid /proc hooks installed in cross_crate_init (gated on the frame
# crate's own `linux-compat`, which must therefore be on — not just
# transitively via narf-verification).
boot-init = ["dep:narf-verification", "narf-verification/boot-init"]

[lints]
workspace = true
