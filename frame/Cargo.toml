[package]
name         = "narf-frame"
description  = "TCB: boot CPU bring-up, trap-prologue PKRS save (Stage 2+), panic path."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "narf-frame"
path = "src/main.rs"

