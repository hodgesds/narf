[package]
name         = "narf-frame"
description  = "TCB: boot CPU bring-up, trap-prologue PKRS save (Stage 2+), panic path."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "narf-frame"
path = "src/main.rs"

[dependencies]
narf-lib           = { path = "../lib" }
narf-security      = { path = "../security" }
narf-acpi          = { path = "../acpi" }
narf-aml           = { path = "../aml" }
narf-arch          = { path = "../arch" }
narf-memory        = { path = "../memory" }
narf-boot          = { path = "../boot" }
narf-console       = { path = "../console" }
narf-crypto        = { path = "../crypto" }
narf-time          = { path = "../time" }
narf-scheduler     = { path = "../scheduler" }
narf-interrupts    = { path = "../interrupts" }
narf-bus           = { path = "../bus" }
narf-io            = { path = "../io" }
narf-block         = { path = "../block" }
narf-drivers-nvme    = { path = "../drivers/nvme" }
narf-drivers-virtio  = { path = "../drivers/virtio" }
narf-drivers-net     = { path = "../drivers/net" }
narf-net             = { path = "../net" }
narf-drivers-wireless = { path = "../drivers/wireless" }
narf-drivers-i3c      = { path = "../drivers/i3c" }
narf-drivers-i2c      = { path = "../drivers/i2c" }
narf-drivers-gpio     = { path = "../drivers/gpio" }
narf-drivers         = { path = "../drivers" }
narf-drivers-storage = { path = "../drivers/storage" }
narf-drivers-usb     = { path = "../drivers/usb" }
narf-drivers-thunderbolt = { path = "../drivers/thunderbolt" }
narf-drivers-fingerprint = { path = "../drivers/fingerprint" }
narf-drivers-platform = { path = "../drivers/platform" }
narf-drivers-fs-ext2  = { path = "../drivers/fs/ext2" }
narf-drivers-fs-ext4  = { path = "../drivers/fs/ext4" }
narf-drivers-fs-fat   = { path = "../drivers/fs/fat" }
narf-drivers-fs-exfat = { path = "../drivers/fs/exfat" }
narf-drivers-fs-minix = { path = "../drivers/fs/minix" }
narf-drivers-fs-iso9660 = { path = "../drivers/fs/iso9660" }
narf-drivers-fs-udf   = { path = "../drivers/fs/udf" }
narf-drivers-fs-9p    = { path = "../drivers/fs/9p" }
narf-input           = { path = "../input" }
narf-input-driver    = { path = "../drivers/input" }
narf-graphics        = { path = "../graphics" }
narf-graphics-driver = { path = "../drivers/graphics" }
narf-drivers-gpu     = { path = "../drivers/gpu" }
narf-drivers-nvidia  = { path = "../drivers/nvidia" }
narf-drivers-psp     = { path = "../drivers/psp" }
narf-drivers-crypto  = { path = "../drivers/crypto" }
narf-init            = { path = "../init" }
narf-fb              = { path = "../fb" }
narf-audio           = { path = "../audio" }
narf-bluetooth       = { path = "../bluetooth" }
narf-edid            = { path = "../edid" }
narf-efi             = { path = "../efi" }
narf-hid             = { path = "../hid" }
narf-pinctrl         = { path = "../pinctrl" }
narf-usbpd           = { path = "../usbpd" }
narf-drivers-usbpd   = { path = "../drivers/usbpd" }
narf-wireless        = { path = "../wireless" }
narf-accel           = { path = "../accel" }
narf-tpm             = { path = "../tpm" }
narf-i3c             = { path = "../i3c" }
narf-pwm             = { path = "../pwm" }
narf-pmbus           = { path = "../pmbus" }
narf-spdm            = { path = "../spdm" }
narf-scmi            = { path = "../scmi" }
narf-shmem           = { path = "../shmem" }
narf-firmware        = { path = "../firmware" }
narf-firmware-fw-cfg = { path = "../firmware/fw_cfg" }
narf-firmware-smbios = { path = "../firmware/smbios" }
narf-firmware-fdt    = { path = "../firmware/fdt" }
narf-initramfs       = { path = "../initramfs" }
narf-power           = { path = "../power" }
narf-observability   = { path = "../observability" }
narf-filesystem      = { path = "../filesystem" }
narf-userspace       = { path = "../userspace" }
narf-user-runtime    = { path = "../user-runtime" }
narf-kernel-test     = { path = "../verification/kernel-test" }
narf-verification    = { path = "../verification", optional = true }

[features]
# Self-test: trigger a #UD at end-of-boot to prove the IDT dispatches.
# Off by default; enable with `cargo xtask run --arch=x86_64 --features idt-selftest`.
idt-selftest = []
# Full-boot smoke: exercise the real init flow (not the kernel-test
# harness), then ACPI-shutdown cleanly via `narf_arch::exit_kernel(0)`
# at a "boot ready" milestone. Lets `cargo xtask boot-smoke` watch for
# panic markers + a natural QEMU exit instead of having to kill the
# child after a wall-clock timeout. Mutually exclusive with
# `kernel-test` (kernel-test takes the test harness path; boot-smoke
# takes the real init path).
boot-smoke = []
# Forward narf-firmware's `firmware-allow-unsigned` so bring-up
# initramfs blobs packed with `xtask pack-firmware` (all-zero
# signature sentinel) actually load. Production builds disable
# this and require keyed signatures.
firmware-allow-unsigned = ["narf-firmware/firmware-allow-unsigned"]
# Run the narf-verification kernel-test harness instead of the async demo.
# Used by `cargo xtask test` — exits 0 if all tests pass, non-zero otherwise.
kernel-test  = [
    "dep:narf-verification",
    "narf-audio/kernel-test",
    "narf-bluetooth/kernel-test",
    "narf-edid/kernel-test",
    "narf-efi/kernel-test",
    "narf-hid/kernel-test",
    "narf-pinctrl/kernel-test",
    "narf-usbpd/kernel-test",
    "narf-drivers-usbpd/kernel-test",
    "narf-drivers-gpu/kernel-test",
    "narf-drivers-nvidia/kernel-test",
    "narf-drivers-fingerprint/kernel-test",
    "narf-wireless/kernel-test",
    "narf-drivers-wireless/kernel-test",
    "narf-accel/kernel-test",
    "narf-tpm/kernel-test",
    "narf-i3c/kernel-test",
    "narf-drivers-i3c/kernel-test",
    "narf-drivers-i2c/kernel-test",
    "narf-drivers-gpio/kernel-test",
    "narf-pwm/kernel-test",
    "narf-pmbus/kernel-test",
    "narf-spdm/kernel-test",
    "narf-scmi/kernel-test",
    "narf-fb/kernel-test",
    "narf-arch/kernel-test",
    "narf-scheduler/kernel-test",
]
# Chain into verification's opt-in user-mode smoke tests (round-trip,
# yield_resume, poll_yield_exit, future yield_exit). These pass the
# kernel through to subsequent tests without exiting.
user-mode-e2e = ["kernel-test", "narf-verification/user-mode-e2e"]
# Chain into verification's full testbin runner (implies user-mode-e2e).
# Enables the `narf-testbin` ELF build and the runner test, which calls
# `exit_kernel(0)` on success and therefore must run last.
user-mode-testbin = ["user-mode-e2e", "narf-verification/user-mode-testbin"]
# Chain into verification's narf-libc validate-binary runner.
# Builds the libc shim + the validate sub-crate's ELF and runs it
# end-to-end through the user-mode pipeline. Like user-mode-testbin,
# this calls `exit_kernel(0)` on success and must run last.
narf-libc-validate = ["user-mode-e2e", "narf-verification/narf-libc-validate"]
# Build init+shell ELFs and load + spawn `init` from the production
# `run_async_demo` boot path. On by default (see `default` above);
# strip with `--no-default-features` for a minimal kernel.
boot-init = ["dep:narf-verification", "narf-verification/boot-init"]

[lints]
workspace = true
