[package]
name        = "narf-bpf"
description = "BPF kernel runtime: kfunc!/struct_ops! registries, the fuel-metered interpreter, and the attach adapters."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
# `bpf/isa`, `bpf/verifier`, and `bpf/jit` are nested packages inside this
# package's directory. Turning off target auto-discovery keeps cargo from
# walking into them looking for bins/examples/benches.
autobins     = false
autoexamples = false
autotests    = false
autobenches  = false

[lib]
name = "narf_bpf"
path = "src/lib.rs"

[features]
default = []
# In-kernel smokes, registered through `narf-kernel-test` into `narf.tests`.
# The crate itself is always linked (the `bpf(2)` handler and
# `register_initcalls()` are unconditional), so this gates only the tests.
#
# `narf-boot` and `narf-console` come with it, for the generated JIT
# differential in `src/tests/jit_fuzz.rs`: `TestResult::Fail` carries a
# `&'static str`, so the seed that reproduces a generated failure has nowhere to
# go except the console, and the cmdline is how a soak run asks for more
# iterations without changing what CI fuzzes.
kernel-test = ["dep:narf-kernel-test", "dep:narf-boot", "dep:narf-console"]
# In-kernel benchmarks, registered through `narf-bpf-bench` and run only when
# the kernel cmdline carries `bpf_bench`. Off by default because it compiles
# `interp::Vm::run_fuel_hoisted` — a fuel policy that bounds iterations rather
# than work, kept solely so the policy that replaced it can be measured against
# it. A production kernel must not be able to name it.
bench = ["dep:narf-bpf-bench"]
# cgroup-v2 memory accounting for map storage. A map's whole footprint is
# chosen by a `bpf(2)` argument, so without this an fd can pin kernel memory
# outside any `memory.max`. Forwarded from `narf-userspace/cgroup` (which is
# where `bpf(2)` lives) rather than enabled unconditionally, so that
# `narf-memory`'s `cgroup` feature stays a real off switch.
cgroup = ["narf-memory/cgroup"]

[dependencies]
narf-bpf-isa      = { path = "isa", version = "0.1.0" }
narf-bpf-verifier = { path = "verifier", version = "0.1.0" }
narf-bpf-jit      = { path = "jit", version = "0.1.0" }
narf-lib          = { path = "../lib", version = "0.1.0" }
narf-memory       = { path = "../memory", version = "0.1.0" }
narf-rcu          = { path = "../rcu", version = "0.1.0" }
narf-arch         = { path = "../arch", version = "0.1.0" }
narf-capabilities = { path = "../capabilities", version = "0.1.0" }
narf-crypto       = { path = "../crypto", version = "0.1.0" }
narf-filesystem   = { path = "../filesystem", version = "0.1.0" }
narf-net          = { path = "../net", version = "0.1.0" }
narf-tracing      = { path = "../tracing", version = "0.1.0" }
narf-init         = { path = "../init", version = "0.1.0" }
narf-time         = { path = "../time", version = "0.1.0" }
narf-kernel-test  = { path = "../verification/kernel-test", version = "0.1.0", optional = true }
narf-boot         = { path = "../boot", version = "0.1.0", optional = true }
narf-console      = { path = "../console", version = "0.1.0", optional = true }
narf-bpf-bench    = { path = "bench", version = "0.1.0", optional = true }

[lints]
workspace = true
