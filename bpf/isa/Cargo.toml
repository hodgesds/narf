[package]
name = "narf-bpf-isa"
description = "BPF instruction set: encoding, decoding, and disassembly. Zero dependencies, host-testable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# In-kernel smoke tests, registered through `narf-kernel-test`. Off by default
# so that host `cargo test` needs no kernel dependencies at all.
kernel-test = ["dep:narf-kernel-test"]

[dependencies]
narf-kernel-test = { path = "../../verification/kernel-test", version = "0.1.0", optional = true }

[lints]
workspace = true
