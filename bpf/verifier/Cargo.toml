[package]
name = "narf-bpf-verifier"
description = "BPF static verifier: type graph, IR, and abstract interpretation. Zero kernel dependencies, host-testable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
kernel-test = ["dep:narf-kernel-test"]

[dependencies]
narf-bpf-isa = { path = "../isa", version = "0.1.0" }
narf-kernel-test = { path = "../../verification/kernel-test", version = "0.1.0", optional = true }

[lints]
workspace = true
