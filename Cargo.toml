# NARF kernel workspace.
# Single workspace so fat LTO can span every crate. See build/specification/spec.md §4.

[workspace]
resolver = "2"
members = [
    "lib",
    "acpi",
    "aml",
    "arch",
    "boot",
    "console",
    "memory",
    "time",
    "scheduler",
    "capabilities",
    "security",
    "ipc",
    "interrupts",
    "verification",
    "verification/kernel-test",
    "frame",
    "rcu",
    "bus",
    "event_bus",
    "build/xtask",
    "abi",
    "io",
    "drivers",
    "drivers/runtime",
    "drivers/virtio",
    "block",
    "crypto",
    "net",
    "wireless",
    "accel",
    "tpm",
    "spdm",
    "pmbus",
    "i3c",
    "filesystem",
    "power",
    "scmi",
    "observability",
    "userspace",
    "user-runtime",
    "drivers/nvme",
    "drivers/net",
    "drivers/wireless",
    "drivers/i2c",
    "drivers/gpio",
    "drivers/i3c",
    "drivers/gpu",
    "drivers/nvidia",
    "drivers/psp",
    "drivers/crypto",
    "drivers/storage",
    "drivers/usb",
    "drivers/usbpd",
    "drivers/extcon",
    "drivers/thunderbolt",
    "drivers/fingerprint",
    "drivers/input",
    "drivers/graphics",
    "drivers/platform",
    "input",
    "graphics",
    "init",
    "fb",
    "audio",
    "bluetooth",
    "edid",
    "efi",
    "hid",
    "usbpd",
    "pwm",
    "pinctrl",
    "shmem",
    "compat/relibc",
    "compat/win",
    "compat/win-rt",
    "firmware",
    "firmware/fw_cfg",
    "firmware/smbios",
    "firmware/fdt",
    "initramfs",
    "drivers/fs/fat",
    "drivers/fs/exfat",
    "drivers/fs/ext2",
    "drivers/fs/ext4",
    "drivers/fs/minix",
    "drivers/fs/iso9660",
    "drivers/fs/udf",
    "drivers/fs/9p",
    "drivers/video",
    "drivers/backlight",
    "drivers/leds",
    "drivers/nfc",
    "drivers/spi",
    "drivers/wwan",
    "drivers/sdio",
    "drivers/sound",
    "drivers/tpm",
    "drivers/hwmon",
    "drivers/serial",
    "modules",
    "modules/test-module",
]
# narf-testbin / userspace/init / userspace/shell are built out-of-
# line by verification's build.rs (and by xtask's iso-boot path)
# because they need a bare-metal target (x86_64-unknown-none),
# distinct linker scripts, and a release profile that doesn't
# inherit the kernel workspace's fat-LTO settings. They define
# `_start` in `#![no_main]` shape, which collides with libc's
# Scrt1.o `_start` if cargo tries to build them for the host —
# so they must NOT be workspace members.
exclude = [
    "userspace/testbin",
    "userspace/init",
    "userspace/shell",
    "narf-libc",
    "narf-libc/validate",
]

[workspace.package]
version      = "0.0.0"
edition      = "2021"
rust-version = "1.85"          # align with 2025-09-14 nightly
license      = "GPL-2.0-or-later"
repository   = "https://github.com/hodgesds/narf"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
# A kernel crate needing panic = abort must never allocate in panic path.
# Explicit lints land as subsystems come online.

# ─── Release profile ────────────────────────────────────────────────
# Fat LTO, per build/specification/spec.md §4.
# compiler_fence(SeqCst) pairs in arch/ wrappers are what keep this correct —
# LTO is aggressive and will happily reorder across inline asm without them.
[profile.release]
opt-level       = 3
lto             = "fat"
codegen-units   = 1
panic           = "abort"
strip           = "none"        # keep symbols — observability/ needs them
debug           = 2
overflow-checks = false         # release trusts bounds; debug always checks
incremental     = false

[profile.dev]
opt-level       = 1             # -O1 — unoptimised kernel code won't boot under QEMU in reasonable time
lto             = false
panic           = "abort"
debug           = 2
overflow-checks = true
incremental     = true

# Reproducible builds: build/specification/spec.md §4.
# SOURCE_DATE_EPOCH is honoured by rustc 1.85+; path remapping is in .cargo/config.toml.
