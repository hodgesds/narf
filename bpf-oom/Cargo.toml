[package]
name         = "narf-bpf-oom"
description  = "BPF OOM policy: a struct_ops consumer binding a verified BPF program set to narf-memory's pluggable OOM victim selector."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_bpf_oom"
path = "src/lib.rs"

[dependencies]
narf-capabilities  = { path = "../capabilities" }
narf-bpf-structops = { path = "../bpf/structops" }
narf-lib           = { path = "../lib" }
narf-memory        = { path = "../memory" }
# The live candidate source: `memory` owns the OOM seam but cannot enumerate
# tasks or deliver signals (that is why `OomKiller` exists at all), so the
# scheduler supplies address spaces and `userspace` supplies identities,
# `oom_score_adj`, and the SIGKILL. Same direction as `narf-bpf-idle` →
# `narf-power`: the seam crate depends on the subsystems, never the reverse.
narf-scheduler     = { path = "../scheduler" }
narf-userspace     = { path = "../userspace" }

# Test-only. The non-test surface names only `ProgSet` (from narf-bpf-structops)
# and the memory/scheduler types, so the BPF runtime itself is pulled in only by
# the smokes that assemble and load the programs they bind.
narf-bpf          = { path = "../bpf", optional = true }
narf-bpf-isa      = { path = "../bpf/isa", optional = true }
narf-bpf-verifier = { path = "../bpf/verifier", optional = true }
narf-kernel-test  = { path = "../verification/kernel-test", optional = true }

[features]
# In-kernel smokes, registered through `narf-kernel-test` into `narf.tests`.
kernel-test = [
    "dep:narf-kernel-test",
    "dep:narf-bpf",
    "dep:narf-bpf-isa",
    "dep:narf-bpf-verifier",
    # Cascade the framework crate's smokes on too, so enabling the `bpf` test
    # feature (which reaches this crate) also compiles the `bpf/structops` tests.
    "narf-bpf-structops/kernel-test",
]

[lints]
workspace = true
