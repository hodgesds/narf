[package]
name = "cargo-narf"
description = "Cargo frontend for building and installing native NARF kernel packages"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "cargo-narf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
