[package]
name         = "xtask"
description  = "NARF build/run/test orchestrator. See build/specification/spec.md §3."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
wait-timeout = "0.2"
# zstd decompression for /lib/firmware/*.zst blobs (Arch ships them
# compressed; Linux kernel decompresses at load time, NARF unpacks
# at build-time and stores the raw payload).
zstd = "0.13"
# `cargo xtask affected` parses `cargo metadata --no-deps` JSON to build
# the workspace dependency graph for change-based CI job selection.
serde_json = "1.0"
# Tokenize registrations without mistaking comments/string examples for tests.
proc-macro2 = "1"
blake3 = { version = "1", default-features = false, features = ["pure"] }
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false }

[lints]
workspace = true
