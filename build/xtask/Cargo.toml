[package]
name         = "xtask"
description  = "NARF build/run/test orchestrator. See build/specification/spec.md §3."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
wait-timeout = "0.2"
# zstd decompression for /lib/firmware/*.zst blobs (Arch ships them
# compressed; Linux kernel decompresses at load time, NARF unpacks
# at build-time and stores the raw payload).
zstd = "0.13"

[lints]
workspace = true
