[package]
name = "narf-uefi-loader"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
narf-boot-protocol = { path = "../../boot/protocol" }
blake2 = { version = "0.10", default-features = false }
uefi = { version = "0.39", features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
sha2 = { version = "0.10", default-features = false }
narf-boot-protocol = { path = "../../boot/protocol" }

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "0.39", features = ["alloc", "global_allocator"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
