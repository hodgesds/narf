[package]
name = "narf-wireless"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.narf]
release-managed = true

[dependencies]
# Kernel-resident dependencies, behind the default `kernel` feature: the
# `WirelessNetIface` trait (a `narf_net::Interface`), nl80211, the wiphy
# registry, rfkill, the regulatory database and the module host. With
# `default-features = false` the crate is the 802.11 protocol layer alone —
# frame/IE types, SAE, EAPOL/RSNA, CCMP/BIP, reorder, A-MSDU, association
# and regulatory rules — which a loadable driver links
# (`modules/MODULE_AUTHORING.md`).
narf-lib = { path = "../lib", optional = true }
narf-net = { path = "../net", optional = true }
narf-bus = { path = "../bus", optional = true }
narf-crypto = { path = "../crypto", default-features = false }
narf-capabilities = { path = "../capabilities", optional = true }
narf-ipc = { path = "../ipc", optional = true }
narf-io = { path = "../io", optional = true }
narf-scheduler = { path = "../scheduler", optional = true }
narf-time = { path = "../time", optional = true }
narf-drivers = { path = "../drivers", optional = true }
narf-firmware = { path = "../firmware", optional = true }
async-trait = "0.1"
futures = { version = "0.3", default-features = false }
narf-kernel-test = { path = "../verification/kernel-test" }
bitflags = "2.4"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[features]
default = ["kernel"]
kernel = [
    "dep:narf-lib",
    "dep:narf-net",
    "dep:narf-bus",
    "dep:narf-capabilities",
    "dep:narf-ipc",
    "dep:narf-io",
    "dep:narf-scheduler",
    "dep:narf-time",
    "dep:narf-drivers",
    "dep:narf-firmware",
    "narf-crypto/kernel",
]
# Tests cover the AP-side SAE-PK generator, so kernel-test pulls it in.
kernel-test = ["kernel", "sae-pk-ap"]
# WPA3 SAE-PK AP-side password/KeyAuth generation (needs ECDSA signing). Off by
# default — NARF is primarily a station; an AP build opts in.
sae-pk-ap = ["narf-crypto/ecdsa-sign"]
