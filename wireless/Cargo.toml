[package]
name = "narf-wireless"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
narf-lib = { path = "../lib" }
narf-net = { path = "../net" }
narf-crypto = { path = "../crypto" }
narf-capabilities = { path = "../capabilities" }
narf-ipc = { path = "../ipc" }
narf-io = { path = "../io" }
narf-scheduler = { path = "../scheduler" }
narf-drivers = { path = "../drivers" }
async-trait = "0.1"
futures = { version = "0.3", default-features = false }
narf-kernel-test = { path = "../verification/kernel-test" }
bitflags = "2.4"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[features]
# Tests cover the AP-side SAE-PK generator, so kernel-test pulls it in.
kernel-test = ["sae-pk-ap"]
# WPA3 SAE-PK AP-side password/KeyAuth generation (needs ECDSA signing). Off by
# default — NARF is primarily a station; an AP build opts in.
sae-pk-ap = ["narf-crypto/ecdsa-sign"]
