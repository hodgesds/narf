[package]
name         = "narf-crypto"
description  = "Crypto primitives, cap-gated keys, RNG, SecureRing skeleton."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_crypto"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib", version = "0.1.0" }
narf-capabilities = { path = "../capabilities", version = "0.1.0" }
narf-ipc          = { path = "../ipc", version = "0.1.0" }
narf-time         = { path = "../time", version = "0.1.0" }
narf-kernel-test  = { path = "../verification/kernel-test", version = "0.1.0" }

# RustCrypto primitives. Default features disabled to keep no_std clean —
# every feature pull is explicit. See spec/specification/spec.md §3 for
# the algorithm matrix; Stage 3 wires Ed25519 verify, ChaCha20-Poly1305
# AEAD, HKDF-SHA-256 and BLAKE3.
ed25519-dalek      = { version = "2",    default-features = false, features = ["zeroize"] }
# chacha20poly1305: poly1305's auto-detected AVX2 backend SIGILLs LLVM
# under `code-model=kernel`; we pin the soft backend via the
# `--cfg poly1305_force_soft` rustflag in `.cargo/config.toml`. With
# that, the dep compiles clean on both arches.
chacha20poly1305   = { version = "0.10", default-features = false, features = ["alloc"] }
aes                = { version = "0.8",  default-features = false }
# aes-gcm: AES-128/256-GCM AEAD for e2e smoke tests and Stage-4 AEAD surface.
# `aes_force_soft` rustflag (see .cargo/config.toml) pins the software AES path
# so AES-NI isn't probed under code-model=kernel.
aes-gcm            = { version = "0.10", default-features = false, features = ["alloc", "aes"] }
xts-mode           = { version = "0.5",  default-features = false }
hkdf               = { version = "0.12", default-features = false }
sha2               = { version = "0.10", default-features = false }
blake3             = { version = "1",    default-features = false, features = ["pure"] }
rand_core          = { version = "0.6",  default-features = false }
rand_chacha        = { version = "0.3",  default-features = false }
zeroize            = { version = "1",    default-features = false }

[lints]
workspace = true
