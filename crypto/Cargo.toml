[package]
name         = "narf-crypto"
description  = "Crypto primitives, cap-gated keys, RNG, SecureRing skeleton."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_crypto"
path = "src/lib.rs"

[dependencies]
# Kernel-resident dependencies, behind the default `kernel` feature: the
# cap-gated key surface (`Cap<Key<Alg>, R>`), the architectural entropy
# source and the post-quantum cap types. With `default-features = false`
# the crate is the bare algorithm set — no kernel crate, no global state —
# which is what a loadable module links (`modules/MODULE_AUTHORING.md`).
narf-lib          = { path = "../lib", optional = true }
narf-arch         = { path = "../arch", optional = true }
narf-capabilities = { path = "../capabilities", optional = true }
narf-ipc          = { path = "../ipc", optional = true }
# The CR0.TS boundary the SSE sections cross (`simd.rs`).
narf-scheduler    = { path = "../scheduler", optional = true }
# Zero-dependency test registry; the algorithm files' smokes register
# through it in every configuration.
narf-kernel-test  = { path = "../verification/kernel-test" }

# RustCrypto primitives. Default features disabled to keep no_std clean —
# every feature pull is explicit. See spec/specification/spec.md §3 for
# the algorithm matrix; Stage 3 wires Ed25519 verify, ChaCha20-Poly1305
# AEAD, HKDF-SHA-256 and BLAKE3.
ed25519-dalek      = { version = "2",    default-features = false, features = ["zeroize"] }
# chacha20poly1305: poly1305's auto-detected AVX2 backend SIGILLs LLVM
# under `code-model=kernel`; we pin the soft backend via the
# `--cfg poly1305_force_soft` rustflag in `.cargo/config.toml`. With
# that, the dep compiles clean on both arches.
chacha20poly1305   = { version = "0.10", default-features = false, features = ["alloc"] }
aes                = { version = "0.8",  default-features = false, features = ["zeroize"] }
# aes-gcm: AES-128/256-GCM AEAD for e2e smoke tests and Stage-4 AEAD surface.
# `aes_force_soft` rustflag (see .cargo/config.toml) pins the software AES path
# so AES-NI isn't probed under code-model=kernel.
aes-gcm            = { version = "0.10", default-features = false, features = ["alloc", "aes", "zeroize"] }
# Not used directly: they turn on aes-gcm's GHASH backends' `zeroize`, so
# the hash key H and the accumulator are wiped when a cipher drops
# (polyval `impl Drop`); aes-gcm does not forward its own `zeroize`.
ghash              = { version = "0.5",  default-features = false, features = ["zeroize"] }
polyval            = { version = "0.6",  default-features = false, features = ["zeroize"] }
xts-mode           = { version = "0.5",  default-features = false }
hkdf               = { version = "0.12", default-features = false }
sha2               = { version = "0.10", default-features = false }
blake3             = { version = "1",    default-features = false, features = ["pure"] }
rand_core          = { version = "0.6",  default-features = false }
rand_chacha        = { version = "0.3",  default-features = false }
zeroize            = { version = "1",    default-features = false, features = ["alloc"] }
subtle             = { version = "2",    default-features = false }

[features]
default = ["kernel"]
# Everything that needs a kernel crate: `Cap<Key<Alg>, R>` and the cap-gated
# primitives, hardware entropy (`try_fill_random_bytes` and friends), the
# post-quantum cap types and the kernel-resident test suites.
kernel = [
    "dep:narf-lib",
    "dep:narf-arch",
    "dep:narf-capabilities",
    "dep:narf-ipc",
    "dep:narf-scheduler",
]
# ECDSA/P-256 signing (RFC 6979 deterministic nonces). Off by default; the
# verify path is always available. Pulled in by WPA3 SAE-PK AP-side generation.
ecdsa-sign = []

[lints]
workspace = true
