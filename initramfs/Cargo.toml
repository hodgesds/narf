[package]
name         = "narf-initramfs"
description  = "Initramfs (CPIO newc) parser, staging static, boot-path handoff. Spec: initramfs/specification/spec.md."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_initramfs"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-filesystem   = { path = "../filesystem" }
narf-init         = { path = "../init" }
narf-capabilities = { path = "../capabilities" }
narf-boot         = { path = "../boot" }
narf-block        = { path = "../block" }
narf-kernel-test  = { path = "../verification/kernel-test" }
zeroize           = { version = "1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
