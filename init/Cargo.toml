[package]
name         = "narf-init"
description  = "Staged initcall registry — Stage enum + Initcall fn + run_stage. Mirrors Linux's *_initcall mechanism without ELF-section magic."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_init"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib", version = "0.1.0" }
narf-memory       = { path = "../memory", version = "0.1.0" }
narf-time         = { path = "../time", version = "0.1.0" }
narf-kernel-test  = { path = "../verification/kernel-test", version = "0.1.0" }

[lints]
workspace = true
