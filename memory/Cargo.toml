[package]
name         = "narf-memory"
description  = "Physical/virtual address types; buddy/slab allocator; domain-tagged mappings."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_memory"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-arch         = { path = "../arch" }
narf-capabilities = { path = "../capabilities" }
narf-kernel-test  = { path = "../verification/kernel-test" }

[features]
default = []

# Test-only path counters used by the distributed kernel smoke suite.
kernel-test = []

# Linux-compat surfaces (mprotect with split/merge, madvise, etc.).
# Enabled by default so modern allocators (jemalloc, mimalloc) and JIT
# engines (V8) see the standard kernel behaviour rather than the
# NARF-native subset.

# Per-namespace address-space tagging.  Orthogonal to linux-compat.
container = []

# cgroup-v2 memory controller accounting seam: exposes a charge/
# uncharge hook the cgroupfs `memory` controller installs at boot, so
# the page/frame allocator can attribute usage to the current cgroup.
cgroup = []

# Scrub a frame's bytes when it returns to the buddy allocator. Opt-in
# debug/hardening aids — each adds a 4 KiB write to the genuine-free
# path (after the COW refcount reaches 0). Off by default.
#
# frame-zero-on-free: fill freed frames with zeros (info-leak hardening:
#   a recycled frame can't expose its previous owner's bytes).
# frame-poison-on-free: fill freed frames with 0xDEAD_BEEF_DEAD_BEEF so a
#   use-after-free / uninitialised-pointer read of a recycled frame
#   faults on an obviously-diagnostic value instead of stale bytes (the
#   tool for the "marginal-buddy" execve #PF). Takes precedence over
#   frame-zero-on-free when both are enabled.
frame-zero-on-free = []
frame-poison-on-free = []

# Slab free-site audit: on the free-block canary trip (write-after-free
# / double-free of a slab block), name WHAT the clobbered object was.
# A ring records each freed block's first two words — for a 16-byte
# {data, vtable} object (Box<dyn>, Arc, RawWaker) word 1 is the vtable
# pointer, so `addr2line` of the captured value resolves the concrete
# Rust type. The tool for the long-standing rip=0x3 vtable-UAF. Off by
# default — adds a ~384 KiB static ring and three stores per free.
slab-free-audit = []

# Per-frame allocation audit: a global 1-bit-per-frame map, marked on
# every buddy alloc and cleared on every buddy free. Panics at the
# SOURCE on a double-alloc (the buddy handing out an already-allocated
# frame) or double-free. The tool for pinpointing the "marginal-buddy"
# bad-free: the bad caller's backtrace is printed at the offending
# alloc/free. Off by default — adds a 512 KiB static bitmap and an
# atomic op per alloc/free.
frame-alloc-audit = []

# Reverse-map free-site audit: the Linux `free_pages_prepare` "nonzero
# mapcount" `bad_page` analogue. On every buddy free of a final-owner frame,
# assert the frame has no `rmap` owners; panic at the SOURCE naming the
# stale (root, va) if one survives. Catches a teardown/unmap path that
# returned a frame without a paired `rmap::remove`, whose stale owner would
# otherwise poison the frame's next allocation (and flake any later
# rmap-sensitive test handed that frame). Takes the frame's rmap shard lock
# per free, so it is compiled out of release; it runs automatically under
# `debug_assertions` (Linux DEBUG_VM gating). This feature ADDITIONALLY forces
# it on in a release build — the default kernel-test suite runs release, so use
# `--features rmap-free-audit` to exercise the guard there. It found and all of
# reap_anonymous / madvise / MAP_FIXED-punch / replace_shared_frame have been
# fixed; the whole memory suite now runs clean under it.
rmap-free-audit = []

# Kernel Address Sanitizer (KASAN) write-catch. Compiles the KASAN runtime
# (src/kasan.rs) — the `__asan_*` callbacks + shadow poison/unpoison hooks —
# and the slab poisons freed blocks so a dangling cross-CPU write trips the
# compiler-emitted inline shadow check, panicking IN the corruptor's frame
# (its RIP appears in the backtrace) instead of blaming the victim. Requires
# the build to also pass `-Zsanitizer=kernel-address` (via `cargo xtask
# <cmd> --kasan`, which injects it into the kernel rustflags). Off by default.
kasan = []


[lints]
workspace = true
