[package]
name         = "narf-memory"
description  = "Physical/virtual address types; buddy/slab allocator; domain-tagged mappings."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_memory"
path = "src/lib.rs"

[dependencies]
narf-lib         = { path = "../lib" }
narf-arch        = { path = "../arch" }
narf-kernel-test = { path = "../verification/kernel-test" }

[features]
# mprotect / madvise / brk extension needed by Linux-compat syscalls.
# Stub for Waves 63-67.
linux-compat = []

# Per-namespace address-space tagging.  Orthogonal to linux-compat.
# Stub for Waves 63-67.
container = []

[lints]
workspace = true
