[package]
name         = "narf-userspace"
description  = "User-mode process model, ELF loader, relibc integration shapes."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_userspace"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-arch         = { path = "../arch" }
narf-abi          = { path = "../abi" }
narf-capabilities = { path = "../capabilities" }
narf-console      = { path = "../console" }
narf-filesystem   = { path = "../filesystem" }
narf-block        = { path = "../block" }
narf-drivers-fs-fat = { path = "../drivers/fs/fat" }
narf-net          = { path = "../net" }
narf-firmware     = { path = "../firmware" }
narf-memory       = { path = "../memory" }
narf-scheduler    = { path = "../scheduler" }
narf-time         = { path = "../time" }
narf-tracing      = { path = "../tracing" }
narf-bpf          = { path = "../bpf" }
narf-bpf-btf      = { path = "../bpf/btf" }
narf-bpf-isa      = { path = "../bpf/isa" }
narf-bpf-verifier = { path = "../bpf/verifier" }
narf-initramfs    = { path = "../initramfs" }
narf-input        = { path = "../input" }
narf-interrupts   = { path = "../interrupts" }
narf-linux-perf-uapi = { path = "../compat/linux-perf-uapi" }
narf-kernel-test  = { path = "../verification/kernel-test" }
narf-modules      = { path = "../modules" }
narf-power        = { path = "../power" }

[features]
# Default-on so the workspace's `cargo xtask kernel-test` driver
# (which doesn't enable any per-crate features explicitly) still
# builds the Linux-shaped surface into the kernel. Strip with
# --no-default-features at the workspace level if a future
# non-Linux-shaped consumer wants them off.
default = ["linux-compat"]

# Kernel-side syscall tracer (poor-man's strace; ptrace is a stub). When on,
# the dispatch point logs process-lifecycle syscalls (clone/fork/execve/exit/
# wait) with their args, and execve logs the resolved path. Low-noise (these
# are spawn/exit-frequency, not the millions of per-stressor work syscalls),
# so it's usable to see what a guest process does before it dies. Off by
# default.
syscall-trace = []
# Just the AF_UNIX connect->accept timestamps (UNIXENQ/UNIXACC), without the
# full syscall firehose. `syscall-trace` writes EVERY syscall to the
# synchronous serial console, which inflates the very latency those two
# lines exist to measure — an observer effect large enough to invalidate the
# number. This lets the gap be measured on an otherwise quiet boot.
unix-latency-trace = []

# In-kernel test harness build. The `abi_*_tests.rs` modules are compiled
# unconditionally (they register into the `narf.tests` link section), so
# this feature does NOT gate them. What it gates is
# `handlers::with_kernel_buffers` — the narrowly-scoped opt-in that lets a
# test hand a kernel-half pointer to a syscall handler. Off (and therefore
# a no-op, with no bypass code compiled at all) in every production build.
kernel-test = []

# Declared so `#[cfg(feature = "user-mode-e2e")]` in tests
# don't trip the unexpected_cfgs lint. The frame crate's
# `user-mode-e2e` feature drives the test-bin runner; this
# entry mirrors the name so tests/ source can guard against
# it.
user-mode-e2e = []

# Linux-shaped syscall surface: epoll, eventfd, timerfd, clone3,
# set_tid_address, mprotect, madvise, dynamic-linker plumbing,
# pthread bring-up under relibc, fcntl(2) extensions, signalfd, memfd,
# Linux ABI struct stat + statx, mount/umount2/chroot, POSIX timers.
linux-compat = ["narf-memory/linux-compat", "narf-filesystem/linux-compat"]

# Namespace isolation: PID, mount, network, UTS, IPC, user namespaces.
# Orthogonal to linux-compat — a container runtime needs both; a
# namespace-aware native kernel needs only this. pivot_root also
# requires both linux-compat and container.
container = ["narf-filesystem/container"]

# cgroup-v2 unified hierarchy. Wires fork-inheritance + exit-cleanup
# of process cgroup membership into the task lifecycle. Forwards to
# narf-filesystem, which owns the cgroupfs tree. Orthogonal to
# linux-compat and container.
cgroup = ["narf-filesystem/cgroup", "narf-bpf/cgroup"]

[lints]
workspace = true
