[package]
name         = "narf-scheduler"
description  = "Cooperative async executor. Stage 1: single-CPU, spawn + block_on + yield_now."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_scheduler"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-acpi         = { path = "../acpi" }
narf-arch         = { path = "../arch" }
narf-rcu          = { path = "../rcu" }
narf-capabilities = { path = "../capabilities" }
narf-memory       = { path = "../memory" }
narf-time         = { path = "../time" }
narf-kernel-test  = { path = "../verification/kernel-test" }

[features]
kernel-test = []

[lints]
workspace = true
