[package]
name         = "narf-scheduler"
description  = "Cooperative async executor. Stage 1: single-CPU, spawn + block_on + yield_now."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_scheduler"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib", version = "0.1.0" }
narf-acpi         = { path = "../acpi", version = "0.1.0" }
narf-arch         = { path = "../arch", version = "0.1.0" }
narf-rcu          = { path = "../rcu", version = "0.1.0" }
narf-capabilities = { path = "../capabilities", version = "0.1.0" }
narf-memory       = { path = "../memory", version = "0.1.0" }
narf-time         = { path = "../time", version = "0.1.0" }
narf-kernel-test  = { path = "../verification/kernel-test", version = "0.1.0" }

[features]
kernel-test = []

# cgroup-v2 cpu + cpuset controller seam: exposes hooks the cgroupfs
# `cpu` / `cpuset` controllers install at boot to apply per-cgroup
# weight/bandwidth and cpu/mems affinity to member tasks. Also forwards
# `narf-memory/cgroup` so the scheduler (which owns the current-task
# register) can install the `memory` controller's charge-PID provider.
cgroup = ["narf-memory/cgroup"]

[lints]
workspace = true
