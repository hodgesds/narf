[package]
name         = "narf-scheduler"
description  = "Cooperative async executor. Stage 1: single-CPU, spawn + block_on + yield_now."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_scheduler"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-acpi         = { path = "../acpi" }
narf-arch         = { path = "../arch" }
narf-rcu          = { path = "../rcu" }
narf-capabilities = { path = "../capabilities" }
narf-memory       = { path = "../memory" }
narf-time         = { path = "../time" }
narf-console      = { path = "../console" }
narf-kernel-test  = { path = "../verification/kernel-test" }

[features]
kernel-test = []
# High-resolution tick (Linux CONFIG_SCHED_HRTICK): per-task one-shot slice
# timer via the timer wheel, so a task is preempted precisely at slice
# exhaustion. Off by default (the default build stays byte-identical).
hrtick = []
# PMU work-cycle scheduling: enables QuantumUnit::Cycles, measuring the slice in
# APERF (actual, frequency-invariant) core cycles rather than wall-time. Off by
# default. (APERF-only tier; fixed/GP-PMC + reservation registry are a follow-up.)
# NOTE: opt-in and intentionally NOT in the CI kernel-test matrix — the feature's
# code is a no-op in the default Nanos mode, but its tiny hot-path perturbation
# deterministically trips a PRE-EXISTING scheduler busy-poll livelock (awake
# stackful tasks not draining; the "ONION #3" wake-race family). Do not add `pmu`
# to a ktest job until that latent race is fixed.
pmu = []

# cgroup-v2 cpu + cpuset controller seam: exposes hooks the cgroupfs
# `cpu` / `cpuset` controllers install at boot to apply per-cgroup
# weight/bandwidth and cpu/mems affinity to member tasks. Also forwards
# `narf-memory/cgroup` so the scheduler (which owns the current-task
# register) can install the `memory` controller's charge-PID provider.
cgroup = ["narf-memory/cgroup"]

[lints]
workspace = true
