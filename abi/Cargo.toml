[package]
name         = "narf-abi"
description  = "Kernel↔user ABI: Submission / Completion / OpCode / NarfStatus + ring wrappers."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_abi"
path = "src/lib.rs"

[dependencies]
narf-capabilities = { path = "../capabilities" }
narf-ipc          = { path = "../ipc" }
narf-lib          = { path = "../lib" }
narf-scheduler    = { path = "../scheduler" }
narf-rcu          = { path = "../rcu" }
narf-tracing      = { path = "../tracing" }
narf-kernel-test  = { path = "../verification/kernel-test" }

[features]
# Native userspace ring dispatcher. Wire types remain available without it.
native-ring = ["narf-scheduler/native-ring"]

kernel-test = ["narf-scheduler/kernel-test"]

[lints]
workspace = true
