[package]
name = "narf-block"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NARF block device abstraction"

[dependencies]
narf-lib = { path = "../lib", version = "0.1.0" }
narf-capabilities = { path = "../capabilities", version = "0.1.0" }
narf-io = { path = "../io", version = "0.1.0" }
narf-memory = { path = "../memory", version = "0.1.0" }
narf-ipc = { path = "../ipc", version = "0.1.0" }
narf-time = { path = "../time", version = "0.1.0" }
narf-tracing = { path = "../tracing", version = "0.1.0" }
narf-crypto  = { path = "../crypto", version = "0.1.0" }
narf-tpm     = { path = "../tpm", version = "0.1.0" }
narf-scheduler = { path = "../scheduler", version = "0.1.0" }
async-trait = "0.1"
narf-kernel-test = { path = "../verification/kernel-test", version = "0.1.0" }

[features]
# cgroup-v2 io controller seam: exposes a hook the cgroupfs `io`
# controller installs at boot to attribute/throttle block requests by
# the submitting task's cgroup.
cgroup = []

[lints]
workspace = true
