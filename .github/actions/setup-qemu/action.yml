name: "Set up newer QEMU"
description: >
  Build (and cache) a qemu-system-x86_64 newer than Ubuntu's, then prepend
  it to PATH. Ubuntu 24.04's QEMU 8.2 has an MTTCG re-entrant-BQL abort, and
  QEMU 9.2 can SIGSEGV when an outstanding NVMe AER is cancelled by a
  controller reset. QEMU 10.2 clears both failures. This action supplies that
  version so the guest can run under real MTTCG (thread=multi). cargo narf resolves
  `qemu-system-x86_64` via PATH, so no cargo narf change is needed.

inputs:
  version:
    description: "QEMU release to build (must be >= 10.2 to clear the CI crashes)"
    required: false
    default: "10.2.3"

runs:
  using: "composite"
  steps:
    - name: Cache QEMU ${{ inputs.version }}
      id: cache-qemu
      uses: actions/cache@v4
      with:
        path: ~/qemu-install
        key: qemu-${{ inputs.version }}-${{ runner.os }}

    - name: Build QEMU ${{ inputs.version }}
      if: steps.cache-qemu.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        # Build deps. libslirp-dev is REQUIRED: QEMU >= 8.0 dropped the
        # bundled slirp, and net-smoke's off-box test uses `-netdev user`
        # hostfwd.
        # QEMU installs its own meson (bundled wheel) into an in-tree venv
        # via python/scripts/mkvenv.py, which needs `distlib` importable —
        # python3-distlib provides it (its absence is a "found no usable
        # distlib" configure failure). python3-venv + python3-pip complete
        # the bootstrap. libslirp-dev is required for `-netdev user` hostfwd.
        sudo apt-get install -y --no-install-recommends \
          build-essential ninja-build pkg-config \
          python3-venv python3-pip python3-distlib \
          libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev flex bison
        curl -fL "https://download.qemu.org/qemu-${{ inputs.version }}.tar.xz" -o /tmp/qemu.tar.xz
        tar -xf /tmp/qemu.tar.xz -C /tmp
        cd "/tmp/qemu-${{ inputs.version }}"
        # The release tarball ships only subprojects/dtc.wrap (a Meson
        # wrap-git pointer) — no subprojects/dtc/ source. Meson would
        # fetch it at ./configure time, i.e. after the patch below runs,
        # which is why the patch died with FileNotFoundError (run
        # 45989443214, job 140499833050). Fetch the pinned revision
        # ourselves first: QEMU 10.2.3's dtc.wrap pins b6910bec (dtc
        # v1.6.1), so ./configure finds the source already in place and
        # the patch applies to the same tree the build compiles.
        git clone https://gitlab.com/qemu-project/dtc.git subprojects/dtc
        git -C subprojects/dtc checkout b6910bec11614980a21e46fbccc35934b671bd81
        # GCC 15 + glibc 2.43 (the ubuntu-latest runner image is now
        # Ubuntu 26.04) rejects the vendored dtc's fdt_overlay.c: it
        # assigns memchr() — whose result is now const-propagating —
        # to `char *sep`, which -Werror=discarded-qualifiers makes
        # fatal (fdt_overlay.c:461/471). Upstream dtc fixed this by
        # making `sep` const (commit 9a1c801a, "Fix discarded const
        # qualifiers"); apply that one-line fix to the vendored copy.
        # The script asserts exactly one replacement and fails loudly
        # if the bundled dtc ever changes shape.
        python3 - <<'PYEOF'
        import pathlib, re, sys
        p = pathlib.Path("subprojects/dtc/libfdt/fdt_overlay.c")
        s = p.read_text()
        new, n = re.subn(r"^(\s*)char \*sep, \*endptr;$",
                         r"\1const char *sep;\n\1char *endptr;",
                         s, count=1, flags=re.M)
        if n != 1:
            print(f"dtc patch: expected exactly 1 'char *sep, *endptr;' "
                  f"declaration, found {n}", file=sys.stderr)
            sys.exit(1)
        p.write_text(new)
        PYEOF
        ./configure \
          --target-list=x86_64-softmmu \
          --prefix="$HOME/qemu-install" \
          --enable-slirp \
          --disable-docs
        make -j"$(nproc)"
        make install

    - name: Prepend QEMU to PATH + verify
      shell: bash
      run: |
        set -euo pipefail
        echo "$HOME/qemu-install/bin" >> "$GITHUB_PATH"
        "$HOME/qemu-install/bin/qemu-system-x86_64" --version
