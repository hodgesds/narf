name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly + on-demand runs so the non-blocking task-#87 repro job can keep
  # trying to catch the rare SMP migration #UD with a decodable core, without
  # taxing every push (it is gated to these events — see the job's `if:`).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""
  # GHA's packaged qemu-system-x86 SIGSEGVs during virtio-balloon
  # bring-up (a host bug; works on local/upstream QEMU). Drop the
  # balloon device from every QEMU boot here so boot-smoke / musl-demo /
  # kernel-test don't crash the emulator; the balloon smokes Skip and
  # init skips the probe. See build/xtask/src/main.rs::qemu_args.
  XTASK_QEMU_NO_BALLOON: "1"
  # Extra buddy headroom for the x86_64 QEMU jobs (boot-smoke / musl-demo
  # / kernel-test). The ~5129-smoke suite sits near the buddy margin at
  # the 1 GiB default; a DMA-heavy probe can then host-SIGSEGV GHA's
  # QEMU. 2 GiB (1 GiB per NUMA node) keeps it comfortably in range.
  # aarch64 + non-QEMU jobs ignore it. See qemu_args / NARF_QEMU_MEM_MB.
  NARF_QEMU_MEM_MB: "2048"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check

  userspace-tests:
    name: userspace unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install

      # login-core is host-testable pure logic (password hashing +
      # /etc/shadow verification used by getty). Its isolated workspace
      # builds with std under `cargo test`.
      - name: login-core unit tests
        run: cargo test --manifest-path userspace/login-core/Cargo.toml

  clippy-kernel:
    name: clippy-kernel / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview clippy

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-clippy-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-clippy-${{ matrix.arch }}-

      # Lint the kernel binary on the bare-metal target, matching the build-std
      # invocation `cargo xtask boot-smoke` uses. This is the only pass that
      # type-checks (and clippy-lints) the arch-gated `cfg(target_arch = ...)`
      # code the host workspace pass never compiles. Build warnings in the
      # kernel crate tree surface here too and are denied.
      #
      # `cgroup-all` is enabled so every cgroup-v2 controller (pids, memory,
      # cpu, cpuset, io, misc, psi) and its cross-crate seams (the memory
      # charge-PID provider in narf-scheduler, the affinity/priority hooks,
      # the block io accounting) are compiled and linted on BOTH arches —
      # otherwise the cgroup-gated code is never built in CI.
      - name: cargo clippy (kernel / ${{ matrix.arch }})
        run: |
          cargo clippy -p narf-frame \
            --target ${{ matrix.arch }}-unknown-none \
            -Zbuild-std=core,compiler_builtins,alloc \
            -Zbuild-std-features=compiler-builtins-mem,compiler-builtins-no-f16-f128 \
            --features boot-smoke,cgroup-all \
            -- -D warnings

  boot-smoke:
    name: boot-smoke / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml pins nightly-2025-09-14 with rust-src + llvm-tools
        # + clippy + rustfmt; rustup honors it automatically on first cargo invocation.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview clippy rustfmt

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-system-arm \
            cpio \
            mtools \
            dosfstools \
            e2fsprogs \
            ovmf

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-${{ matrix.arch }}-

      - name: cargo xtask boot-smoke
        run: cargo xtask boot-smoke --arch=${{ matrix.arch }}

  musl-demo:
    name: musl-demo (x86_64)
    runs-on: ubuntu-latest
    # Generous job-level timeout: a cold-cache cargo build of the
    # kernel + verification crates takes ~10-15 min on GHA's free
    # runners, plus two TCG QEMU boots at ~30-60s each.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview rustfmt

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            cpio \
            mtools \
            dosfstools \
            e2fsprogs \
            ovmf \
            musl-tools \
            clang \
            lld \
            linux-libc-dev

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-x86_64-musl-demo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-x86_64-

      # Boots QEMU six times — three musl smokes plus three
      # busybox applets:
      #   * `/bin/hello` (hand-rolled int 0x80 asm) → `hello`
      #   * `/bin/hello_musl` (musl-static) → `hello from musl`
      #   * `/bin/hello_musl_dyn` (musl-dyn via PT_INTERP →
      #     ld-musl) → `hello from musl dyn`
      #   * `busybox echo hello` → `hello`
      #   * `busybox pwd` → `/`
      #   * `busybox uname -a` → `Linux` (matches the trailing
      #     `GNU/Linux\n` in `NARF narf 0.1 narf x86_64 GNU/Linux`)
      #   * `hello_pthread` → `joined` — pthread_create + join
      #     end-to-end. Catches regressions in clone(2) ABI,
      #     syscall save-state, per-thread TLS programming, and
      #     the CLONE_CHILD_CLEARTID exit-observer chain.
      # Regressions in the loader (unaligned PT_LOAD), ABI
      # dispatch (syscall instruction → raw handler),
      # arch_prctl wiring, CR4.OSFXSR, SyscallReturn struct
      # layout, brk shrink-bound, AT_PHDR/PhEnt/PhNum auxv,
      # apply_relocations PT_INTERP gating, syscall-entry user
      # arg-register preservation, or `writev(2)` handling all
      # surface here.
      #
      # `musl-tools` (apt) supplies ld-musl-x86_64.so.1 (as
      # `/usr/lib/x86_64-linux-musl/libc.so` — verification/build.rs
      # walks a candidate list including Ubuntu's path). Without it
      # `NARF_LD_MUSL` is empty, the kernel skips the /lib mount, and
      # `hello_musl_dyn` fails to exec.
      #
      # GHA's TCG QEMU is ~5-10x slower than KVM-accelerated local
      # runs; bump the per-boot prompt/echo timeouts so a slow cold
      # boot under load doesn't fail the smoke. Local fast runs use
      # the un-bumped defaults (60s prompt / 30s echo).
      - name: cargo xtask musl-demo
        env:
          XTASK_RI_PROMPT_TIMEOUT_SECS: "900"
          XTASK_RI_ECHO_TIMEOUT_SECS: "900"
        run: cargo xtask musl-demo --arch=x86_64

  net-smoke:
    name: net-smoke (x86_64, off-box serving)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview rustfmt

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            cpio \
            mtools \
            dosfstools \
            e2fsprogs \
            ovmf \
            musl-tools \
            clang \
            lld \
            linux-libc-dev

      # Ubuntu ships QEMU 8.2, which aborts under MTTCG + virtio-net + SLIRP
      # with the re-entrant-BQL assertion. Build a newer QEMU (>= 9.0, past
      # the fix) so net-smoke can run under real MTTCG. Cached after first build.
      - name: Set up newer QEMU (past the 8.2 MTTCG BQL bug)
        uses: ./.github/actions/setup-qemu

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-x86_64-net-smoke-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-x86_64-

      # Off-box network serving: boot with the `qemu-net` static config +
      # a QEMU user-mode `hostfwd`, then connect a REAL host TCP socket to
      # the forwarded port and assert the guest echo server round-trips
      # the line back over virtio-net. Exercises the kernel TCP server
      # path (wildcard listen → passive open → accept-queue), blocking
      # accept(2), ingress-aware ARP, and the virtio-net RX/TX path
      # end-to-end with an external client. GHA's TCG QEMU is slow under
      # load; bump the prompt deadline.
      #
      # `cargo xtask net-smoke` sets the `no_redis` kernel cmdline flag, so the
      # `qemu-net` boot-init runs netserve ALONE — without it, redis-server's
      # heavy multi-threaded startup starved netserve's RX forwarder on the
      # single CI vcpu under TCG and dragged the echo past the host deadline
      # (a spurious `echo mismatch — got ""`; the historical ~20% flake).
      #
      # Run under REAL MTTCG (thread=multi). The QEMU 8.2 re-entrant-BQL
      # abort (`qemu_mutex_lock_iothread_impl: assertion failed
      # (!qemu_mutex_iothread_locked())`) that used to force a SMP=1 pin is a
      # QEMU bug fixed in >= 9.0 — the "Set up newer QEMU" step above provides
      # it. Combined with this branch's virtio-net barrier/kick fixes (a real
      # hardware fence at `needs_kick`, so the store->load ordering the device
      # observes is correct), the guest side is now MTTCG-safe. SMP stays 1:
      # net-smoke is a single off-box connection and needs no extra vCPUs, and
      # 1-vCPU MTTCG still drives the exact BQL code path that used to abort.
      # `cargo xtask net-smoke` sets `no_redis` (netserve alone). (Unset accel
      # locally → KVM.)
      - name: cargo xtask net-smoke
        env:
          XTASK_RI_PROMPT_TIMEOUT_SECS: "900"
          NARF_QEMU_SMP: "1"
          XTASK_QEMU_ACCEL: "tcg,thread=multi"
          # Route a 2nd serial (COM2) to a file so a kernel core is captured if
          # the guest ever #UD/#GP/#PFs here despite the SMP=1 pin. The trap
          # handler writes an ELF core (NT_PRSTATUS + a PT_LOAD of the kernel
          # stack) out COM2 (see frame/src/x86_64/trap.rs).
          NARF_QEMU_COM2_FILE: "${{ runner.temp }}/netsmoke-core.bin"
        run: cargo xtask net-smoke --arch=x86_64
      # Drop the core file unless it actually holds a crash dump (QEMU creates
      # it empty when no core is written), so the upload only fires on a crash.
      - name: keep core only if non-empty
        if: always()
        run: '[ -s "${{ runner.temp }}/netsmoke-core.bin" ] || rm -f "${{ runner.temp }}/netsmoke-core.bin"'
      - name: upload kernel core (net-smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netsmoke-kernel-core
          path: ${{ runner.temp }}/netsmoke-core.bin
          if-no-files-found: ignore

  # Best-effort reproducer + core-capture for the OPEN task-#87 SMP user-task
  # migration #UD (redis's clone(2) bio threads faulting with a corrupt resumed
  # context when migrated across APs). NON-BLOCKING (`continue-on-error`): it is
  # a diagnostic, not a gate — it exists solely to catch one crash with a
  # decodable kernel core. Runs redis-smoke at a MULTI-vCPU MTTCG machine (where
  # the race lives; redis-smoke's own default pins SMP=1 to hide it) a handful
  # of times, breaks on the first crash, and uploads the COM2 core + serial log.
  # Decode with: gdb target/x86_64-unknown-none/debug/narf-frame <core> -ex bt
  # (or read the `backtrace (stack words in kernel .text)` lines in the log and
  # `addr2line -e <kernel-elf> <+off>`).
  task87-repro:
    name: task-#87 SMP migration repro (non-blocking)
    # Nightly + manual only — this runs several slow MTTCG boots purely to try
    # to catch the rare crash; skip it on push/PR so it never delays a merge.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Generous: a cold-cache kernel build + several slow MTTCG boots must finish
    # so the `if: always()` upload step can publish a captured core.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview rustfmt
      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 cpio mtools dosfstools e2fsprogs ovmf \
            musl-tools clang lld linux-libc-dev
      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-x86_64-task87-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-x86_64-
      - name: redis-smoke repro loop (multi-vCPU MTTCG)
        env:
          XTASK_RI_PROMPT_TIMEOUT_SECS: "900"
          # SMP>1 (override redis-smoke's SMP=1 pin) + MTTCG = the race window.
          NARF_QEMU_SMP: "16"
          XTASK_QEMU_ACCEL: "tcg,thread=multi"
        run: |
          set -u
          out="${{ runner.temp }}/cores"
          mkdir -p "$out"
          core="${{ runner.temp }}/core.bin"
          log="${{ runner.temp }}/run.log"
          for i in $(seq 1 6); do
            echo "=== task-#87 repro iteration $i/6 ==="
            rm -f "$core"
            NARF_QEMU_COM2_FILE="$core" cargo xtask redis-smoke --arch=x86_64 2>&1 | tee "$log" || true
            if grep -q "CPU EXCEPTION" "$log" || [ -s "$core" ]; then
              echo "::warning::task-#87 CRASH reproduced on iteration $i — uploading core + serial log"
              cp "$core" "$out/kcore.bin" 2>/dev/null || true
              cp "$log" "$out/crash.log"
              break
            fi
          done
          # Artifact dir is empty (upload skipped) unless a crash was captured.
          ls -la "$out" || true
      - name: upload cores + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task87-cores
          path: ${{ runner.temp }}/cores
          if-no-files-found: ignore

  kernel-test:
    name: kernel-test (x86_64)
    runs-on: ubuntu-latest
    # The full in-kernel smoke suite (~5100 tests) runs in one QEMU boot
    # under TCG (no KVM on GHA), plus a cold build of the kernel +
    # verification crates and the phase-2 boot-smoke pass. Generous.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview rustfmt

      - name: Install host build deps
        # Same set as the musl-demo job: `cargo xtask test` builds the
        # kernel-test image, which pulls the verification crate whose
        # build.rs compiles the musl-demo smokes (needs musl-tools +
        # linux-libc-dev). QEMU + OVMF boot the image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            cpio \
            mtools \
            dosfstools \
            e2fsprogs \
            ovmf \
            musl-tools \
            linux-libc-dev

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-x86_64-kernel-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-x86_64-

      # Phase 1 boots the kernel-test image and FAILS the job if any
      # smoke fails (the runner exit_kernel(1)s on failure; xtask test
      # gates on that status). Phase 2 boots real init and checks for
      # panics. `cgroup-all` so every cgroup-v2 controller's smokes run.
      # GHA's TCG QEMU is far slower than local KVM; bump the per-phase
      # QEMU timeouts so a slow boot under load doesn't false-fail.
      #
      # The hardware tests that need capabilities GHA's old TCG qemu64
      # CPU lacks — x2APIC (the TLB-shootdown / IPI smokes) and the
      # cache-topology CPUID leaf — detect their absence and Skip, so no
      # accel tuning is needed here. (`XTASK_QEMU_ACCEL=tcg,thread=multi`
      # is available as an escape hatch if a future runner exposes
      # x2APIC under TCG and the shootdown smokes start running.)
      - name: cargo xtask test --features cgroup-all
        env:
          XTASK_QEMU_TIMEOUT_SECS: "2400"
          XTASK_BOOT_SMOKE_TIMEOUT_SECS: "1200"
        run: cargo xtask test --arch=x86_64 --features cgroup-all

  feature-matrix:
    name: feature-check / ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "linux-compat"
          - "container"
          - "linux-compat,container"
          - "cgroup"
          - "linux-compat,container,cgroup"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: featurecheck-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: featurecheck-${{ runner.os }}-

      - name: cargo check (features = "${{ matrix.features }}")
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check -p narf-userspace --no-default-features
          else
            cargo check -p narf-userspace --no-default-features --features '${{ matrix.features }}'
          fi
