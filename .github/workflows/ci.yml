name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly + on-demand runs so the non-blocking task-#87 repro job can keep
  # trying to catch the rare SMP migration #UD with a decodable core, without
  # taxing every push (it is gated to these events — see the job's `if:`).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""
  # GHA's packaged qemu-system-x86 SIGSEGVs during virtio-balloon
  # bring-up (a host bug; works on local/upstream QEMU). Drop the
  # balloon device from every QEMU boot here so boot-smoke / musl-demo /
  # kernel-test don't crash the emulator; the balloon smokes Skip and
  # init skips the probe. See build/xtask/src/main.rs::qemu_args.
  XTASK_QEMU_NO_BALLOON: "1"
  # Extra buddy headroom for the x86_64 QEMU jobs (boot-smoke / musl-demo
  # / kernel-test). The ~5129-smoke suite sits near the buddy margin at
  # the 1 GiB default; a DMA-heavy probe can then host-SIGSEGV GHA's
  # QEMU. 2 GiB (1 GiB per NUMA node) keeps it comfortably in range.
  # aarch64 + non-QEMU jobs ignore it. See qemu_args / NARF_QEMU_MEM_MB.
  NARF_QEMU_MEM_MB: "2048"

jobs:
  # Change-based CI gate. Computes which jobs + kernel-test subsystems the
  # diff can affect (crate reverse-dependency closure, see
  # `cargo xtask affected`) and exports the decision as job outputs the
  # downstream jobs gate on. On push-to-main / nightly / manual (and on a
  # hub-crate / build-infra / unknown-path change), `full` is true and every
  # job runs exactly as it did before this gate existed — the safety net.
  # A `ci-full` PR label forces a full run.
  changes:
    name: compute affected
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.affected.outputs.full }}
      run_clippy: ${{ steps.affected.outputs.run_clippy }}
      clippy_arches: ${{ steps.affected.outputs.clippy_arches }}
      run_boot_smoke: ${{ steps.affected.outputs.run_boot_smoke }}
      run_kernel_test: ${{ steps.affected.outputs.run_kernel_test }}
      run_musl_demo: ${{ steps.affected.outputs.run_musl_demo }}
      run_net_smoke: ${{ steps.affected.outputs.run_net_smoke }}
      run_feature_matrix: ${{ steps.affected.outputs.run_feature_matrix }}
      subsystems: ${{ steps.affected.outputs.subsystems }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git merge-base <base> HEAD` resolves (the diff
          # is against the merge-base, not the base tip).
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Compute affected jobs + subsystems
        id: affected
        run: |
          set -eu
          # For a pull_request, `base_ref` is the target branch; for
          # push/schedule/dispatch it is empty and `affected` forces a full
          # run via --event regardless of --base.
          BASE_REF="${{ github.base_ref }}"
          BASE_REF="${BASE_REF:-main}"
          git fetch --no-tags origin "$BASE_REF" || true
          FORCE=""
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}" = "true" ]; then
            FORCE="--force-full"
          fi
          # shellcheck disable=SC2086
          cargo xtask affected --github \
            --event "${{ github.event_name }}" \
            --base "origin/$BASE_REF" \
            $FORCE

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check

  host-tests:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install

      - name: Host unit-test gate
        run: cargo xtask host-test

  clippy-kernel:
    name: clippy-kernel / ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.run_clippy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # x86_64 always; aarch64 only when the diff touches arch-sensitive
        # paths (arch/**, drivers/**, *aarch64*, asm) — see `xtask affected`.
        arch: ${{ fromJSON(needs.changes.outputs.clippy_arches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview clippy

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-clippy-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-clippy-${{ matrix.arch }}-

      # Lint the kernel binary on the bare-metal target, matching the build-std
      # invocation `cargo xtask boot-smoke` uses. This is the only pass that
      # type-checks (and clippy-lints) the arch-gated `cfg(target_arch = ...)`
      # code the host workspace pass never compiles. Build warnings in the
      # kernel crate tree surface here too and are denied.
      #
      # `cgroup-all` is enabled so every cgroup-v2 controller (pids, memory,
      # cpu, cpuset, io, misc, psi) and its cross-crate seams (the memory
      # charge-PID provider in narf-scheduler, the affinity/priority hooks,
      # the block io accounting) are compiled and linted on BOTH arches —
      # otherwise the cgroup-gated code is never built in CI.
      #
      # `bpf-idle` and `bpf-leds` are enabled for the same reason: the BPF
      # consumer crates live behind those features, so without them the
      # kernel-target lint never compiles their production paths on either arch.
      - name: cargo clippy (kernel / ${{ matrix.arch }})
        run: |
          cargo clippy -p narf-frame \
            --target ${{ matrix.arch }}-unknown-none \
            -Zbuild-std=core,compiler_builtins,alloc \
            -Zbuild-std-features=compiler-builtins-mem,compiler-builtins-no-f16-f128 \
            --features boot-smoke,cgroup-all,bpf-idle,bpf-leds \
            -- -D warnings

      - name: aarch64 UEFI loader tests + clippy
        if: matrix.arch == 'aarch64'
        run: |
          cargo test --manifest-path build/uefi-loader/Cargo.toml
          cargo clippy --manifest-path build/uefi-loader/Cargo.toml \
            --tests -- -D warnings
          cargo clippy --manifest-path build/uefi-loader/Cargo.toml \
            --target aarch64-unknown-uefi --release \
            -Zbuild-std=core,compiler_builtins,alloc \
            -Zbuild-std-features=compiler-builtins-mem \
            -- -D warnings

  boot-smoke:
    name: boot-smoke / ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.run_boot_smoke == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same arch pruning as clippy: aarch64 boot only when the change is
        # arch-sensitive; otherwise x86_64 alone.
        arch: ${{ fromJSON(needs.changes.outputs.clippy_arches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml pins nightly-2025-09-14 with rust-src + llvm-tools
        # + clippy + rustfmt; rustup honors it automatically on first cargo invocation.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview clippy rustfmt

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-system-arm \
            cpio \
            mtools \
            dosfstools \
            e2fsprogs \
            ovmf \
            qemu-efi-aarch64 \
            xorriso

      # Ubuntu's QEMU 8.2 can silently terminate NARF under MTTCG during
      # device probing. The kernel-test and musl-demo jobs already use this
      # pinned newer build for the same failure mode; iso-boot must exercise
      # the guest under the same stable emulator.
      - name: Set up newer QEMU (past the 8.2 instability)
        if: matrix.arch == 'x86_64'
        uses: ./.github/actions/setup-qemu

      - name: Install Limine
        uses: ./.github/actions/setup-limine

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-${{ matrix.arch }}-

      - name: cargo xtask boot-smoke
        run: cargo xtask boot-smoke --arch=${{ matrix.arch }}

      - name: cargo xtask iso-boot (firmware UEFI)
        run: cargo xtask iso-boot --arch=${{ matrix.arch }}

  # ── musl-demo, split into a build-once job + a per-subsystem-group matrix ──
  # The ~80 musl/linux-compat cases are bucketed into coarse subsystem groups
  # (gui, net, signals, ipc, fs, mem, process, linux-compat). `musl-build`
  # cross-builds the kernel once and uploads it; each `musl-demo` group job
  # downloads that artifact and boots it (no rebuild), so a flaky case reddens
  # only its group and reruns re-run only that group. See `xtask musl-demo`.
  musl-build:
    name: musl-demo build (x86_64)
    needs: changes
    if: needs.changes.outputs.run_musl_demo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview rustfmt

      - name: Install host build deps
        # musl-tools + clang/lld + linux-libc-dev so verification/build.rs can
        # compile the musl smokes and bake ld-musl into the image at BUILD
        # time (the per-group boot jobs then need none of this).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio mtools dosfstools e2fsprogs ovmf \
            musl-tools clang lld linux-libc-dev

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-x86_64-musl-demo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-x86_64-

      # Build the same kernel image `xtask musl-demo` would boot (boot-init +
      # firmware-allow-unsigned, with the demo binaries embedded).
      - name: Build kernel image
        run: cargo xtask build --arch=x86_64 --features boot-init,firmware-allow-unsigned

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: musl-kernel
          path: target/x86_64-unknown-none/release/narf-frame
          if-no-files-found: error
          retention-days: 1

      - name: Enumerate subsystem groups
        id: groups
        run: echo "groups=$(cargo run -q -p xtask -- musl-demo --list-groups)" >> "$GITHUB_OUTPUT"

  musl-demo:
    name: musl-demo / ${{ matrix.group }}
    needs: [changes, musl-build]
    if: needs.changes.outputs.run_musl_demo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.musl-build.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install

      # apt's qemu is shadowed by the newer build below, but installing it
      # pulls the shared runtime libs (libslirp0, pixman, glib) the built
      # qemu-system-x86_64 dynamically links — needed when setup-qemu is a
      # cache hit and its build-deps step is skipped.
      - name: Install QEMU runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      # Ubuntu's QEMU 8.2 crashes NARF on GHA (pervasive per-process-exit
      # #UD/#GP that never reproduces on newer QEMU / locally); build a newer
      # one so the guest matches local behaviour. Cached after first build.
      - name: Set up newer QEMU (past the 8.2 instability)
        uses: ./.github/actions/setup-qemu

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: musl-kernel
          path: prebuilt

      # Boot the prebuilt kernel and run only this group's cases (lightweight
      # cases share one boot; GUI cases each get a fresh boot). GHA's TCG QEMU
      # is ~5-10x slower than local KVM, so the per-boot timeouts are bumped.
      - name: cargo xtask musl-demo --group ${{ matrix.group }}
        env:
          XTASK_RI_PROMPT_TIMEOUT_SECS: "900"
          XTASK_RI_ECHO_TIMEOUT_SECS: "900"
        run: |
          cargo xtask musl-demo \
            --group "${{ matrix.group }}" \
            --prebuilt "$GITHUB_WORKSPACE/prebuilt/narf-frame"

  net-smoke:
    name: net-smoke (x86_64, off-box serving)
    needs: changes
    if: needs.changes.outputs.run_net_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview rustfmt

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            cpio \
            mtools \
            dosfstools \
            e2fsprogs \
            ovmf \
            musl-tools \
            clang \
            lld \
            linux-libc-dev

      # Ubuntu ships QEMU 8.2, which aborts under MTTCG + virtio-net + SLIRP
      # with the re-entrant-BQL assertion. Build a newer QEMU (>= 9.0, past
      # the fix) so net-smoke can run under real MTTCG. Cached after first build.
      - name: Set up newer QEMU (past the 8.2 MTTCG BQL bug)
        uses: ./.github/actions/setup-qemu

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-x86_64-net-smoke-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-x86_64-

      # Off-box network serving: boot with the `qemu-net` static config +
      # a QEMU user-mode `hostfwd`, then connect a REAL host TCP socket to
      # the forwarded port and assert the guest echo server round-trips
      # the line back over virtio-net. Exercises the kernel TCP server
      # path (wildcard listen → passive open → accept-queue), blocking
      # accept(2), ingress-aware ARP, and the virtio-net RX/TX path
      # end-to-end with an external client. GHA's TCG QEMU is slow under
      # load; bump the prompt deadline.
      #
      # `cargo xtask net-smoke` sets the `no_redis` kernel cmdline flag, so the
      # `qemu-net` boot-init runs netserve ALONE — without it, redis-server's
      # heavy multi-threaded startup starved netserve's RX forwarder on the
      # single CI vcpu under TCG and dragged the echo past the host deadline
      # (a spurious `echo mismatch — got ""`; the historical ~20% flake).
      #
      # Run under REAL MTTCG (thread=multi). The QEMU 8.2 re-entrant-BQL
      # abort (`qemu_mutex_lock_iothread_impl: assertion failed
      # (!qemu_mutex_iothread_locked())`) that used to force a SMP=1 pin is a
      # QEMU bug fixed in >= 9.0 — the "Set up newer QEMU" step above provides
      # it. Combined with this branch's virtio-net barrier/kick fixes (a real
      # hardware fence at `needs_kick`, so the store->load ordering the device
      # observes is correct), the guest side is now MTTCG-safe. SMP stays 1:
      # net-smoke is a single off-box connection and needs no extra vCPUs, and
      # 1-vCPU MTTCG still drives the exact BQL code path that used to abort.
      # `cargo xtask net-smoke` sets `no_redis` (netserve alone). (Unset accel
      # locally → KVM.)
      - name: cargo xtask net-smoke
        env:
          XTASK_RI_PROMPT_TIMEOUT_SECS: "900"
          NARF_QEMU_SMP: "1"
          XTASK_QEMU_ACCEL: "tcg,thread=multi"
          # Route a 2nd serial (COM2) to a file so a kernel core is captured if
          # the guest ever #UD/#GP/#PFs here despite the SMP=1 pin. The trap
          # handler writes an ELF core (NT_PRSTATUS + a PT_LOAD of the kernel
          # stack) out COM2 (see frame/src/x86_64/trap.rs).
          NARF_QEMU_COM2_FILE: "${{ runner.temp }}/netsmoke-core.bin"
        run: cargo xtask net-smoke --arch=x86_64
      # Drop the core file unless it actually holds a crash dump (QEMU creates
      # it empty when no core is written), so the upload only fires on a crash.
      - name: keep core only if non-empty
        if: always()
        run: '[ -s "${{ runner.temp }}/netsmoke-core.bin" ] || rm -f "${{ runner.temp }}/netsmoke-core.bin"'
      - name: upload kernel core (net-smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netsmoke-kernel-core
          path: ${{ runner.temp }}/netsmoke-core.bin
          if-no-files-found: ignore

  # Best-effort reproducer + core-capture for the OPEN task-#87 SMP user-task
  # migration #UD (redis's clone(2) bio threads faulting with a corrupt resumed
  # context when migrated across APs). NON-BLOCKING (`continue-on-error`): it is
  # a diagnostic, not a gate — it exists solely to catch one crash with a
  # decodable kernel core. Runs redis-smoke at a MULTI-vCPU MTTCG machine (where
  # the race lives; redis-smoke's own default pins SMP=1 to hide it) a handful
  # of times, breaks on the first crash, and uploads the COM2 core + serial log.
  # Decode with: gdb target/x86_64-unknown-none/debug/narf-frame <core> -ex bt
  # (or read the `backtrace (stack words in kernel .text)` lines in the log and
  # `addr2line -e <kernel-elf> <+off>`).
  task87-repro:
    name: task-#87 SMP migration repro (non-blocking)
    # Nightly + manual only — this runs several slow MTTCG boots purely to try
    # to catch the rare crash; skip it on push/PR so it never delays a merge.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Generous: a cold-cache kernel build + several slow MTTCG boots must finish
    # so the `if: always()` upload step can publish a captured core.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview rustfmt
      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 cpio mtools dosfstools e2fsprogs ovmf \
            musl-tools clang lld linux-libc-dev
      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-x86_64-task87-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-x86_64-
      - name: redis-smoke repro loop (multi-vCPU MTTCG)
        env:
          XTASK_RI_PROMPT_TIMEOUT_SECS: "900"
          # SMP>1 (override redis-smoke's SMP=1 pin) + MTTCG = the race window.
          NARF_QEMU_SMP: "16"
          XTASK_QEMU_ACCEL: "tcg,thread=multi"
        run: |
          set -u
          out="${{ runner.temp }}/cores"
          mkdir -p "$out"
          core="${{ runner.temp }}/core.bin"
          log="${{ runner.temp }}/run.log"
          for i in $(seq 1 6); do
            echo "=== task-#87 repro iteration $i/6 ==="
            rm -f "$core"
            NARF_QEMU_COM2_FILE="$core" cargo xtask redis-smoke --arch=x86_64 2>&1 | tee "$log" || true
            if grep -q "CPU EXCEPTION" "$log" || [ -s "$core" ]; then
              echo "::warning::task-#87 CRASH reproduced on iteration $i — uploading core + serial log"
              cp "$core" "$out/kcore.bin" 2>/dev/null || true
              cp "$log" "$out/crash.log"
              break
            fi
          done
          # Artifact dir is empty (upload skipped) unless a crash was captured.
          ls -la "$out" || true
      - name: upload cores + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task87-cores
          path: ${{ runner.temp }}/cores
          if-no-files-found: ignore

  stress-ng-kasan:
    name: stress-ng under KASAN (nightly, non-blocking)
    # Nightly + manual only: boot a rotating set of stress-ng stressors under the
    # KASAN kernel to shake out freed-slab corruption (poisoned-block writes
    # panic IN the corruptor's frame) and userspace fault regressions. Slow, so
    # it never gates a push/PR. continue-on-error keeps a caught crash from
    # failing the workflow — the artifact + ::warning:: are the signal.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview rustfmt
      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 cpio mtools dosfstools e2fsprogs ovmf \
            musl-tools clang lld linux-libc-dev curl
      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-x86_64-stressng-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-x86_64-
      - name: Build stress-ng Alpine rootfs
        run: sh verification/data/musl-demo/REGEN_stress_rootfs.sh
      - name: stress-ng under KASAN
        env:
          # SMP>1 + the KASAN kernel + heavy churn = the coverage window.
          NARF_QEMU_SMP: "16"
          NARF_QEMU_MEM_MB: "2048"          # KASAN shadow is carved from RAM
          XTASK_QEMU_SNAPSHOT: "1"          # boot the rootfs copy-on-write
          XTASK_RI_PROMPT_TIMEOUT_SECS: "600"
          # The workload runs ~10 stressors; `--expect STRESS-DONE` exits as soon
          # as the final marker prints, so this ceiling only bounds a hang.
          XTASK_RI_ECHO_TIMEOUT_SECS: "2400"
        run: |
          set -u
          out="${{ runner.temp }}/stress"; mkdir -p "$out"
          log="$out/kasan.log"; core="$out/kasan.core"
          NARF_QEMU_COM2_FILE="$core" \
            timeout 3000 cargo xtask run-interactive --kasan --cmd chroot_run \
              --expect STRESS-DONE > "$log" 2>&1 || true
          echo "=== stress-ng summary ==="
          grep -E "=== stressor:|passed:|failed:|SIGSEGV|SIGILL|STRESSOR-RC|KASAN:|CPU EXCEPTION|panicked" "$log" || true
          if grep -qE "KASAN: (store|load)|CPU EXCEPTION|KERNEL PANIC" "$log" || [ -s "$core" ]; then
            echo "::warning::stress-ng-kasan: KERNEL crash / KASAN catch — see the uploaded core + log"
          fi
          if grep -qE "SIGSEGV|SIGILL|failed: [1-9]" "$log"; then
            echo "::warning::stress-ng-kasan: a stressor worker faulted (userspace SIGSEGV/SIGILL or stressor failure)"
          fi
      - name: upload logs + cores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-ng-kasan
          path: ${{ runner.temp }}/stress
          if-no-files-found: ignore

  kernel-test:
    name: kernel-test (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.run_kernel_test == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same arch pruning as clippy/boot-smoke. The build can't be pruned
        # (frame links ~everything) but the SUBSYSTEM EXECUTION is filtered
        # to the affected subsystems below.
        arch: ${{ fromJSON(needs.changes.outputs.clippy_arches) }}
    # The full in-kernel smoke suite (~5100 tests) runs in one QEMU boot
    # under TCG (no KVM on GHA), plus a cold build of the kernel +
    # verification crates and the phase-2 boot-smoke pass. Generous.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src llvm-tools-preview rustfmt

      - name: Install host build deps
        # Same set as the musl-demo build job: `cargo xtask test` builds the
        # kernel-test image, which pulls the verification crate whose
        # build.rs compiles the musl-demo smokes (needs musl-tools +
        # linux-libc-dev). QEMU + OVMF boot the image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-system-arm \
            cpio \
            mtools \
            dosfstools \
            e2fsprogs \
            ovmf \
            musl-tools \
            linux-libc-dev

      # Ubuntu's QEMU 8.2 flakes the kernel-test suite on GHA ("QEMU exited
      # None" — silent abort/timeout, no crash dump); build a newer one.
      - name: Set up newer QEMU (past the 8.2 instability)
        if: matrix.arch == 'x86_64'
        uses: ./.github/actions/setup-qemu

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache build target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ matrix.arch }}-kernel-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: target-${{ runner.os }}-${{ matrix.arch }}-

      # Phase 1 boots the kernel-test image and FAILS the job if any
      # smoke fails (the runner exit_kernel(1)s on failure; xtask test
      # gates on that status). Phase 2 boots real init and checks for
      # panics. `cgroup-all` so every cgroup-v2 controller's smokes run.
      # GHA's TCG QEMU is far slower than local KVM; bump the per-phase
      # QEMU timeouts so a slow boot under load doesn't false-fail.
      #
      # When the change is scoped, `needs.changes.outputs.subsystems` is a
      # comma list of the affected subsystems and only those run (the build
      # still links the whole kernel; only the execution is filtered).
      # Empty (a full run) executes every subsystem.
      #
      # The hardware tests that need capabilities GHA's old TCG qemu64
      # CPU lacks — x2APIC (the TLB-shootdown / IPI smokes) and the
      # cache-topology CPUID leaf — detect their absence and Skip.
      - name: cargo xtask test --features cgroup-all
        env:
          XTASK_QEMU_TIMEOUT_SECS: "2400"
          XTASK_BOOT_SMOKE_TIMEOUT_SECS: "1200"
        run: |
          SUBS="${{ needs.changes.outputs.subsystems }}"
          if [ -n "$SUBS" ]; then
            echo "kernel-test: affected-subsystem filter = $SUBS"
            cargo xtask test --arch=${{ matrix.arch }} --features cgroup-all --subsystem "$SUBS"
          else
            cargo xtask test --arch=${{ matrix.arch }} --features cgroup-all
          fi

  feature-matrix:
    name: feature-check / ${{ matrix.features }}
    needs: changes
    if: needs.changes.outputs.run_feature_matrix == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "linux-compat"
          - "container"
          - "linux-compat,container"
          - "cgroup"
          - "linux-compat,container,cgroup"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: featurecheck-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: featurecheck-${{ runner.os }}-

      - name: cargo check (features = "${{ matrix.features }}")
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check -p narf-userspace --no-default-features
          else
            cargo check -p narf-userspace --no-default-features --features '${{ matrix.features }}'
          fi
