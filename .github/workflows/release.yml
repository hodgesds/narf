name: Release packages

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .verification.verified)" = true
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  packages:
    needs: [validate, kernel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            format: deb
            arch: x86_64
            publish: true
            stage_tar: true
            install: apt-get update && apt-get install -y dpkg-dev git python3
          - image: ubuntu:latest
            format: deb
            arch: x86_64
            publish: false
            stage_tar: false
            install: apt-get update && apt-get install -y dpkg-dev git python3
          - image: fedora:latest
            format: rpm
            arch: x86_64
            publish: true
            stage_tar: false
            install: dnf install -y git rpm-build python3
          - image: archlinux:latest
            format: arch
            arch: x86_64
            publish: true
            stage_tar: false
            install: pacman -Syu --noconfirm base-devel git python
          - image: gentoo/stage3:latest
            format: gentoo
            arch: x86_64
            publish: true
            stage_tar: false
            install: emerge --sync && emerge dev-lang/python dev-vcs/git
          - image: debian:stable
            format: deb
            arch: aarch64
            publish: true
            stage_tar: true
            install: apt-get update && apt-get install -y dpkg-dev git python3
          - image: ubuntu:latest
            format: deb
            arch: aarch64
            publish: false
            stage_tar: false
            install: apt-get update && apt-get install -y dpkg-dev git python3
          - image: fedora:latest
            format: rpm
            arch: aarch64
            publish: true
            stage_tar: false
            install: dnf install -y git rpm-build python3
          - image: archlinux:latest
            format: arch
            arch: aarch64
            publish: true
            stage_tar: false
            install: pacman -Syu --noconfirm base-devel git python
          - image: gentoo/stage3:latest
            format: gentoo
            arch: aarch64
            publish: true
            stage_tar: false
            install: emerge --sync && emerge dev-lang/python dev-vcs/git
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.install }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: target
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: packaging/build-release.sh --version "$VERSION" --arch "${{ matrix.arch }}" --skip-build --formats "${{ matrix.format }}"
      - name: Stage canonical release assets
        if: matrix.publish
        env:
          ARCH: ${{ matrix.arch }}
          FORMAT: ${{ matrix.format }}
          STAGE_TAR: ${{ matrix.stage_tar }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          out="target/release-assets/$VERSION"
          upload=target/release-upload
          mkdir -p "$upload"
          case "$FORMAT" in
            deb) cp "$out"/*.deb "$upload/" ;;
            rpm) cp "$out"/*.rpm "$upload/" ;;
            arch) cp "$out"/*.pkg.tar.* "$upload/" ;;
            gentoo)
              tar -C "$out/gentoo" -czf \
                "$upload/narf-gentoo-overlay-$VERSION-$ARCH.tar.gz" .
              ;;
          esac
          if [[ "$STAGE_TAR" == true ]]; then
            cp "$out/narf-$VERSION-$ARCH.tar.gz" "$upload/"
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.publish
        with:
          name: package-${{ matrix.arch }}-${{ matrix.format }}-${{ strategy.job-index }}
          path: target/release-upload

  kernel:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Set up Rust + shared compiler cache
        uses: ./.github/actions/setup-rust-cache
        with:
          components: rust-src llvm-tools-preview
      - name: Install Limine
        uses: ./.github/actions/setup-limine
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" cargo xtask build --arch=x86_64
      - run: |
          sudo apt-get update
          sudo apt-get install -y mtools
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" cargo xtask image --arch=aarch64
      - run: |
          mkdir -p target/narf-uefi
          cp "$LIMINE_PATH/BOOTX64.EFI" target/narf-uefi/BOOTX64.EFI
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            target/x86_64-unknown-none/release/narf-frame
            target/narf-uefi/BOOTX64.EFI
            target/narf-frame-aarch64.efi-elf
            target/narf-uefi-aarch64/narf.efi

  iso-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso ovmf qemu-efi-aarch64 \
            qemu-system-x86 qemu-system-arm \
            cpio mtools dosfstools e2fsprogs
      - name: Install Limine
        uses: ./.github/actions/setup-limine
      - name: Set up Rust + shared compiler cache
        uses: ./.github/actions/setup-rust-cache
        with:
          components: rust-src llvm-tools-preview
      # Exercise the removable-media path through OVMF first. This
      # verification build has boot-smoke enabled and must emit its
      # serial success marker before exiting through isa-debug-exit.
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" cargo xtask iso-boot --arch=x86_64
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" cargo xtask iso-boot --arch=aarch64
      # Rebuild without boot-smoke so the published image keeps running.
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" cargo xtask image --arch=x86_64
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" cargo xtask image --arch=aarch64
      - run: |
          cd target
          sha256sum narf-x86_64.iso > narf-x86_64.iso.sha256
          sha256sum narf-aarch64-uefi.img > narf-aarch64-uefi.img.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-iso
          path: |
            target/narf-x86_64.iso
            target/narf-x86_64.iso.sha256
            target/narf-aarch64-uefi.img
            target/narf-aarch64-uefi.img.sha256

  publish:
    needs: [validate, packages, iso-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-iso
          path: assets
      - name: Write consolidated package checksums
        run: |
          cd assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' |
            sort | xargs sha256sum >SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes assets/*
