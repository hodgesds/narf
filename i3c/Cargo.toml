[package]
name = "narf-i3c"
description = "Transport-neutral I3C bus types and controller interfaces for NARF."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
narf-lib = { path = "../lib", version = "0.1.0" }
narf-capabilities = { path = "../capabilities", version = "0.1.0" }
narf-io = { path = "../io", version = "0.1.0" }
narf-scheduler = { path = "../scheduler", version = "0.1.0" }
async-trait = "0.1"
futures = { version = "0.3", default-features = false }
narf-kernel-test = { path = "../verification/kernel-test", version = "0.1.0" }
bitflags = "2.4"

[features]
kernel-test = []
