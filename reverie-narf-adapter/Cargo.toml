[package]
name = "reverie-narf-adapter"
description = "Narf kernel side of the one-address-space Reverie backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Everything Reverie-facing is x86_64-only: reverie-syscalls without std is
# defined only for x86_64 (`compile_error!` in reverie-syscalls/src/lib.rs), so
# on any other target this crate is empty and pulls in no Reverie crate.
[target.'cfg(target_arch = "x86_64")'.dependencies]
narf-console = { path = "../console" }
narf-filesystem = { path = "../filesystem" }
narf-kernel-test = { path = "../verification/kernel-test" }
narf-lib = { path = "../lib" }
narf-memory = { path = "../memory" }
narf-rcu = { path = "../rcu" }
narf-scheduler = { path = "../scheduler" }
narf-time = { path = "../time" }
narf-userspace = { path = "../userspace" }
# Only for the kernel tests: the vDSO image (`NARF_VDSO_ELF`) a guest calls.
narf-verification = { path = "../verification", optional = true }
# One exact commit of the Reverie fork. `default-features = false` keeps
# Reverie's `std` feature off; nothing in this workspace turns it on.
reverie = { package = "reverie-core", git = "https://github.com/rrnewton/reverie", rev = "c6c047b63e82dab57943cb9215413e1c14f465cf", default-features = false }
reverie-narf-core = { git = "https://github.com/rrnewton/reverie", rev = "c6c047b63e82dab57943cb9215413e1c14f465cf", default-features = false }
reverie-narf-tools = { git = "https://github.com/rrnewton/reverie", rev = "c6c047b63e82dab57943cb9215413e1c14f465cf", default-features = false }
# Detcore, Hermit's deterministic Tool, for the boot's `reverie_tool=detcore`:
# Hermit's Detcore crates as this kernel builds them without std, exported by
# Hermit's scripts/export-detcore-kernel-crates.sh with Reverie at the commit
# above (branch narf/detcore-kernel-crates of https://github.com/rrnewton/hermit).
# The workspace patches crates.io's rand_pcg to the same commit.
detcore = { package = "hermit-detcore", git = "https://github.com/rrnewton/hermit", rev = "73ba8dcf5c9d83d09fb557d7afdd41b259455345" }
# Parses the Detcore configuration the boot embeds.
serde_json = { version = "1.0.140", default-features = false, features = ["alloc"] }

[features]
# Registers the adapter's in-kernel tests (subsystem `reverie-narf`) and
# assembles the guests they run. Enabled by frame's `kernel-test`.
kernel-test = ["narf-userspace/verification-test-reset", "dep:narf-verification"]

[lints]
workspace = true
