[package]
name         = "narf-io"
description  = "DMA buffers, IOMMU context, P2P DMA. Stage 3 Wave 3a: alloc_coherent / free_coherent + Cap<DmaBuffer, _> hand-off."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_io"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-memory       = { path = "../memory" }
narf-capabilities = { path = "../capabilities" }
narf-acpi         = { path = "../acpi" }
narf-kernel-test  = { path = "../verification/kernel-test" }

[features]
# Declared so `#[cfg(feature = "kernel-test")]` in src/ doesn't
# trip the unexpected_cfgs lint. Empty body — gating is purely
# at the source level; the kernel-test harness pulls these
# crates through whether the feature is on or not.
kernel-test = []

[lints]
workspace = true
