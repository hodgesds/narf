version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_bus"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-arch         = { path = "../arch" }
narf-memory       = { path = "../memory" }
narf-boot         = { path = "../boot" }
narf-capabilities = { path = "../capabilities" }
narf-interrupts   = { path = "../interrupts" }
narf-time         = { path = "../time" }
narf-kernel-test  = { path = "../verification/kernel-test" }

[features]
kernel-test = []

[lints]
workspace = true
