# Minimal NARF kernel module used by the loader's end-to-end smokes.
#
# This crate is intentionally tiny: it compiles to a relocatable ELF
# that demonstrates the authoring shape from MODULE_AUTHORING.md
# (modinfo lines, narf_module_init / narf_module_exit C-ABI symbols,
# one cap-typed export hook). The kernel's end-to-end smokes in
# `modules/src/tests_e2e.rs` synthesize an ELF blob in-line so they
# don't depend on the workspace cross-compiler being set up to emit
# a relocatable .o; this crate is the human-readable reference that
# tracks the same shape so authors of out-of-tree modules can copy
# from it.
#
# Built with `cargo xtask build-module`, which compiles it for the kernel
# target, extracts this crate's own object members from the `staticlib`
# archive, and `ld -r`s them into the single relocatable object the loader
# wants — merging the per-static `.modinfo` sections in the process.
#
# Linux refs:
#   * tools/testing/selftests/kmod/kmod_test.sh — userspace smoke
#     using a real test_module.ko.
#   * lib/test_modload.c — kernel-side regression module loaded by
#     the kmod selftests.

[package]
name         = "narf-test-module"
description  = "Tiny NARF kernel module used as a reference shape + smoke input."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name        = "narf_test_module"
crate-type  = ["staticlib"]

[dependencies]
# None, and that is the point: a module links *against* the kernel — the
# loader resolves its undefined symbols through KSYMTAB at load time — so it
# declares what it calls in an `extern "C"` block and depends on nothing.
# Depending on `narf-modules` (the loader) would compile a second copy of the
# memory, filesystem, console and time crates into the module, all of which
# are already resident in the running kernel.

[lints]
workspace = true
