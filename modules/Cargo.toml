[package]
name         = "narf-modules"
description  = "Runtime-loadable kernel module subsystem: ELF parse, relocate, lifecycle, /proc + /sys integration."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_modules"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib", version = "0.1.0" }
narf-capabilities = { path = "../capabilities", version = "0.1.0" }
narf-kernel-test  = { path = "../verification/kernel-test", version = "0.1.0" }
narf-filesystem   = { path = "../filesystem", version = "0.1.0" }

[lints]
workspace = true

[features]
linux-compat = ["narf-filesystem/linux-compat"]
