[package]
name         = "narf-modules"
description  = "Runtime-loadable kernel module subsystem: ELF parse, relocate, lifecycle, /proc + /sys integration."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_modules"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-arch         = { path = "../arch" }
narf-scheduler    = { path = "../scheduler" }
narf-memory       = { path = "../memory" }
narf-console      = { path = "../console" }
narf-init         = { path = "../init" }
narf-time         = { path = "../time" }
narf-capabilities = { path = "../capabilities" }
narf-bus          = { path = "../bus" }
narf-kernel-test  = { path = "../verification/kernel-test" }
narf-filesystem   = { path = "../filesystem" }
narf-initramfs    = { path = "../initramfs" }
narf-crypto       = { path = "../crypto" }

[lints]
workspace = true

[features]
default = []
# Developer / CI escape hatch for raw, unsigned `.ko` images. Production
# builds leave this disabled and require a valid trailer from a configured
# trusted signer.
module-allow-unsigned = []
