[package]
name         = "narf-modules"
description  = "Runtime-loadable kernel module subsystem: ELF parse, relocate, lifecycle, /proc + /sys integration."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "narf_modules"
path = "src/lib.rs"

[dependencies]
narf-lib          = { path = "../lib" }
narf-arch         = { path = "../arch" }
narf-scheduler    = { path = "../scheduler" }
narf-memory       = { path = "../memory" }
narf-console      = { path = "../console" }
narf-boot         = { path = "../boot" }
narf-init         = { path = "../init" }
narf-time         = { path = "../time" }
narf-capabilities = { path = "../capabilities" }
narf-bus          = { path = "../bus" }
narf-firmware     = { path = "../firmware" }
narf-block        = { path = "../block" }
narf-kernel-test  = { path = "../verification/kernel-test" }
narf-filesystem   = { path = "../filesystem" }
narf-initramfs    = { path = "../initramfs" }
narf-crypto       = { path = "../crypto" }
# `narf_wireless_regdomain`: the installed regulatory domain, for USB Wi-Fi
# modules (rtw88.ko) that cannot reach the regulatory database otherwise.
narf-wireless     = { path = "../wireless" }
# `narf_usb_netif_*`: USB Wi-Fi station interfaces.
narf-net          = { path = "../net" }
# `modules/e2e/rtw88`: the USB module match table the rtw88 `.ko` fills.
narf-drivers-usb  = { path = "../drivers/usb" }
# `narf_smbios_read`: the firmware SMBIOS table, for drivers whose board data
# is keyed on an OEM structure (ath11k's type-0xF8 BDF variant).
narf-firmware-smbios = { path = "../firmware/smbios" }

[lints]
workspace = true

[features]
default = []
# Developer / CI escape hatch for raw, unsigned `.ko` images. Production
# builds leave this disabled and require a valid trailer from a configured
# trusted signer.
module-allow-unsigned = []
